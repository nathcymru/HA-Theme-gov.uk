# Add to configuration.yaml (or a package) to create the helper that drives
# the emergency banner. Restart or reload helpers afterwards.
input_select:
  govuk_banner_type:
    name: civica household alert type
    icon: mdi:alert-octagon
    options:
      - none
      - death_notable_person
      - national_emergency
      - local_emergency

input_text:
  govuk_banner_message:
    name: civica household alert message
    icon: mdi:message-alert
    max: 255

# Set on only after the relevant action succeeds; reset before the next action.
input_boolean:
  civica_action_confirmed:
    name: Action confirmed
    initial: false

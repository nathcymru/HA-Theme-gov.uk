# civica.uk confirmation panel. Requires card-mod and cards/helpers.yaml.
# Set this helper only after a real action succeeds, and reset it before retrying.
# Replace the example message with the actual completed action. Never invent a reference.
type: conditional
conditions:
  - condition: state
    entity: input_boolean.civica_action_confirmed
    state: 'on'
card:
  type: markdown
  content: |
    ## Action completed
    Your change has been saved.
  card_mod:
    style: |
      ha-card {
        background: var(--civica-success-fill);
        color: var(--civica-on-success);
        border: 5px solid var(--civica-success-fill);
        border-radius: 0;
        text-align: center;
        padding: clamp(15px, 4vw, 35px);
      }
      ha-markdown { color: var(--civica-on-success); }

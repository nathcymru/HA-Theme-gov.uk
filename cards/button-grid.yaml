# civica.uk action buttons. Requires card-mod. Replace the example entities.
type: grid
columns: 2
square: false
cards:
  - type: button
    entity: light.living_room
    name: Living room
    show_icon: false
    tap_action:
      action: toggle
    card_mod:
      style: |
        ha-card {
          background: var(--primary-color);
          color: var(--text-primary-color);
          border: 2px solid transparent;
          border-radius: 0;
          box-shadow: 0 2px 0 var(--ha-color-primary-10);
          font-size: var(--civica-font-size-body, 19px);
          font-weight: 400;
          line-height: 1.3;
          padding: 8px 10px 7px;
          min-height: 44px;
          height: auto;
        }
        ha-card:hover { background: var(--civica-action-hover, var(--dark-primary-color)); }
        ha-card:focus-visible {
          outline: 3px solid transparent;
          border-color: var(--ha-color-focus);
          background: var(--ha-color-focus);
          color: var(--civica-focus-text);
          box-shadow: 0 2px 0 var(--civica-focus-text);
        }
  - type: button
    entity: light.kitchen
    name: Kitchen
    show_icon: false
    tap_action:
      action: toggle
    card_mod:
      style: |
        ha-card {
          background: var(--primary-color);
          color: var(--text-primary-color);
          border: 2px solid transparent;
          border-radius: 0;
          box-shadow: 0 2px 0 var(--ha-color-primary-10);
          font-size: var(--civica-font-size-body, 19px);
          font-weight: 400;
          line-height: 1.3;
          padding: 8px 10px 7px;
          min-height: 44px;
          height: auto;
        }
        ha-card:hover { background: var(--civica-action-hover, var(--dark-primary-color)); }
        ha-card:focus-visible {
          outline: 3px solid transparent;
          border-color: var(--ha-color-focus);
          background: var(--ha-color-focus);
          color: var(--civica-focus-text);
          box-shadow: 0 2px 0 var(--civica-focus-text);
        }

# Complete original civica card specimens; synthetic data and local actions only.
examples:
  card-image-room:
    title: A room card with an image and one destination
    description: An original kitchen illustration helps identify the room. The heading is the only link; opening it reaches a complete local example overview.
    height: 920
    html: <article class="civica-card-demo " aria-labelledby="image-kitchen-title"><img class="civica-card-demo__media" src="../images/card-kitchen.svg" width="640" height="360" alt="Illustrated kitchen counter and sink below a window, with a tall cupboard on the left."><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="image-kitchen-title"><a class="govuk-link" href="#image-kitchen-overview">Kitchen overview</a></h2><p class="govuk-body">Find the example lights, temperature and household notes for this room.</p><p class="govuk-body">Illustration of an invented kitchen, not a photograph or live camera image.</p></div></article><section id="image-kitchen-overview" tabindex="-1"><h2 class="govuk-heading-m" id="image-kitchen-overview-heading">Kitchen overview</h2><p class="govuk-body">Synthetic room summary, reported at <time datetime="2026-11-11T18:42:00+00:00">11 November 2026 at 18:42 GMT</time> (Europe/London).</p><dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Ceiling light</dt><dd class="govuk-summary-list__value">Off</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Room temperature</dt><dd class="govuk-summary-list__value">19.8 °C</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Household note</dt><dd class="govuk-summary-list__value">The light and temperature are separate entities. This preview cannot operate them.</dd></div></dl></section>
    artwork:
      source: docs/data/card-artwork-provenance.json
      assets:
        - docs/source/images/card-kitchen.svg
      alternative_text_decision: Use the per-image alt attribute in this specimen; any omitted/redundant meaning is fully present in its text.
  card-image-device:
    title: Device artwork with separate actions
    description: The original lamp diagram identifies a synthetic light. The button gives local request feedback and the details link opens a real section; neither changes the reported state.
    height: 1100
    html: '<article class="civica-card-demo " aria-labelledby="image-lamp-title"><img class="civica-card-demo__media" src="../images/card-reading-lamp.svg" width="640" height="360" alt="An invented desk lamp beside an open book."><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="image-lamp-title">Reading lamp</h2><p class="govuk-body"><strong>Last reported state: Off</strong></p><p class="govuk-body">Reported at <time datetime="2026-11-11T18:42:00+00:00">11 November 2026 at 18:42 GMT</time> (Europe/London).</p><div class="civica-card-demo__actions"><button type="button" class="govuk-button" data-demo-message="Example request accepted locally. No newer reported state has been confirmed. The earlier Off observation is unchanged; no device command was sent.">Preview turn-on request</button><a class="govuk-link" href="#image-lamp-details">View reading lamp details</a></div><p class="govuk-body" data-demo-status role="status"></p><p class="govuk-body">The illustration does not indicate whether the lamp is on.</p></div></article><section id="image-lamp-details" tabindex="-1"><h2 class="govuk-heading-m" id="image-lamp-details-heading">Reading lamp details</h2><dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Area</dt><dd class="govuk-summary-list__value">Living room</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Example capability</dt><dd class="govuk-summary-list__value">On and off</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Last reported state</dt><dd class="govuk-summary-list__value">Off, at <time datetime="2026-11-11T18:42:00+00:00">11 November 2026 at 18:42 GMT</time> (Europe/London)</dd></div></dl><p class="govuk-body">Only the on/off capability is assumed by this fictional example. Brightness, colour and other controls require actual support from the integration.</p></section>'
    artwork:
      source: docs/data/card-artwork-provenance.json
      assets:
        - docs/source/images/card-reading-lamp.svg
      alternative_text_decision: Use the per-image alt attribute in this specimen; any omitted/redundant meaning is fully present in its text.
  card-horizontal-guide:
    title: A horizontal image card that stacks on a phone
    description: A room diagram and complete description sit side by side when space allows. At narrow widths the image comes before the text in the same reading order.
    height: 900
    html: <article class="civica-card-demo civica-card-demo--horizontal" aria-labelledby="horizontal-guide-title"><img class="civica-card-demo__media" src="../images/card-room-schematic.svg" width="640" height="360" alt="Two smaller rooms are on the left; the living room is the larger room on the right, with a sensor marker near its upper-right corner."><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="horizontal-guide-title"><a class="govuk-link" href="#horizontal-guide-content">Find the living-room sensor</a></h2><p class="govuk-body">Use the room name and entity details to distinguish similar temperature sensors. The marker identifies the right-hand room in this invented layout.</p><p class="govuk-body">The schematic is not a surveyed floor plan or a live reading.</p></div></article><section id="horizontal-guide-content" tabindex="-1"><h2 class="govuk-heading-m" id="horizontal-guide-content-heading">Find the living-room sensor</h2><p class="govuk-body">In this example, the living room is to the right of the hall and kitchen. The marker identifies its sensor, not a temperature or warning.</p><ol class="govuk-list govuk-list--number"><li>Find the named room in the dashboard.</li><li>Open the sensor’s details.</li><li>Check its name, area, integration and last reported time before using the reading.</li></ol><p class="govuk-body">A real installation must use its configured room and entity information; the drawing cannot locate a physical device.</p></section>
    artwork:
      source: docs/data/card-artwork-provenance.json
      assets:
        - docs/source/images/card-room-schematic.svg
      alternative_text_decision: Use the per-image alt attribute in this specimen; any omitted/redundant meaning is fully present in its text.
  card-responsive-group:
    title: A responsive group with different content lengths
    description: Related room destinations form a list. Long names wrap; cards do not truncate their text or force matching content lengths.
    height: 1400
    html: <h1 class="govuk-heading-l">Example room guides</h1><p class="govuk-body">Choose a guide. The illustrations are invented and do not show current device states.</p><ul class="civica-card-demo-grid"><li><article class="civica-card-demo " aria-labelledby="group-kitchen-title"><img class="civica-card-demo__media" src="../images/card-kitchen.svg" width="640" height="360" alt=""><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="group-kitchen-title"><a class="govuk-link" href="#group-kitchen">Kitchen</a></h2><p class="govuk-body">Read about the room’s lighting and temperature readings.</p></div></article></li><li><article class="civica-card-demo " aria-labelledby="group-reading-title"><img class="civica-card-demo__media" src="../images/card-reading-lamp.svg" width="640" height="360" alt=""><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="group-reading-title"><a class="govuk-link" href="#group-reading">Living room and family reading corner</a></h2><p class="govuk-body">Find the reading lamp and understand what its reported state means. The longer title is kept in full.</p></div></article></li><li><article class="civica-card-demo " aria-labelledby="group-sensor-title"><img class="civica-card-demo__media" src="../images/card-room-schematic.svg" width="640" height="360" alt=""><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="group-sensor-title"><a class="govuk-link" href="#group-sensors">Room sensors</a></h2><p class="govuk-body">Check a sensor’s source, observation time and availability. A missing reading is not zero.</p></div></article></li></ul><section id="group-kitchen" tabindex="-1"><h2 class="govuk-heading-m" id="group-kitchen-heading">Kitchen</h2><p class="govuk-body">The example ceiling light reported Off and the separate room sensor reported 19.8 °C on 11 November 2026 at 18:42 GMT (Europe/London). A light state does not establish the sensor state. Neither entity is connected in this preview.</p></section><section id="group-reading" tabindex="-1"><h2 class="govuk-heading-m" id="group-reading-heading">Living room and family reading corner</h2><p class="govuk-body">The example reading lamp reported Off on 11 November 2026 at 18:42 GMT (Europe/London). If a later turn-on request is accepted, keep this earlier observation until a new state arrives; acceptance alone does not prove that the lamp turned on.</p></section><section id="group-sensors" tabindex="-1"><h2 class="govuk-heading-m" id="group-sensors-heading">Room sensors</h2><p class="govuk-body">Unknown means no usable value has been supplied. Unavailable means the integration cannot currently supply the entity’s state. An older reading needs its original observation time and must not be called current. None of these states is a zero measurement.</p></section>
    artwork:
      source: docs/data/card-artwork-provenance.json
      assets:
        - docs/source/images/card-kitchen.svg
        - docs/source/images/card-reading-lamp.svg
        - docs/source/images/card-room-schematic.svg
      alternative_text_decision: Use the per-image alt attribute in this specimen; any omitted/redundant meaning is fully present in its text.
  card-device-pending:
    title: A complete pending device card
    description: Static pending state shows the accepted request, earlier reported value and lack of confirmation. A second action is disabled while the illustrated request remains pending.
    height: 870
    html: <article class="civica-card-demo " aria-labelledby="card-pending-title"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="card-pending-title">Porch light</h2><p class="govuk-body"><strong>Waiting for a reported state</strong></p><dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Last reported state</dt><dd class="govuk-summary-list__value">Off, at <time datetime="2026-11-11T18:42:00+00:00">11 November 2026 at 18:42 GMT</time> (Europe/London)</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Turn-on request</dt><dd class="govuk-summary-list__value">Accepted at <time datetime="2026-11-11T18:43:00+00:00">11 November 2026 at 18:43 GMT</time> (Europe/London)</dd></div></dl><p class="govuk-body">A new device state has not arrived. The earlier Off state is not a confirmed outcome for this request.</p><button type="button" class="govuk-button" disabled aria-describedby="pending-card-help">Turn on porch light</button><p class="govuk-body" id="pending-card-help">This static example keeps the action unavailable while it waits. It does not finish automatically or send a device command.</p><a class="govuk-link" href="#pending-card-details">Review the example request</a></div></article><section id="pending-card-details" tabindex="-1"><h2 class="govuk-heading-m" id="pending-card-details-heading">Example request details</h2><p class="govuk-body">A real control must release its pending guard when the request is rejected or the defined waiting period ends. If the outcome is still uncertain, explain that it may complete and check the reported state before repeating a non-idempotent action.</p></section>
  card-device-unavailable:
    title: An unavailable device keeps its useful context
    description: The card retains a clearly dated earlier state and an explanation. It does not infer that the device is off, offline or safe.
    height: 900
    html: '<article class="civica-card-demo " aria-labelledby="card-unavailable-title"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="card-unavailable-title">Utility room light</h2><p class="govuk-body"><strong>Unavailable</strong></p><p class="govuk-body">The integration cannot currently supply this entity’s state.</p><dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Earlier reported state</dt><dd class="govuk-summary-list__value">Off</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Earlier observation</dt><dd class="govuk-summary-list__value"><time datetime="2026-11-10T16:15:00+00:00">10 November 2026 at 16:15 GMT</time> (Europe/London)</dd></div></dl><button type="button" class="govuk-button" disabled aria-describedby="unavailable-card-help">Turn on utility room light</button><p class="govuk-body" id="unavailable-card-help">This example cannot send a request while the entity is unavailable. The older Off reading does not establish the current state.</p><a class="govuk-link" href="#unavailable-card-details">Read the availability details</a></div></article><section id="unavailable-card-details" tabindex="-1"><h2 class="govuk-heading-m" id="unavailable-card-details-heading">Availability details</h2><p class="govuk-body">Synthetic entity: <code>light.example_utility</code>. The unavailable state does not diagnose a router fault or prove a loss of physical power.</p><p class="govuk-body">In a real installation, inspect the native entity and integration information. Do not substitute another light or change permissions to bypass the limitation.</p></section>'
  card-group-partial:
    title: A group summary with an unavailable member
    description: The total includes every configured member. Available-state counts and the unavailable member are stated separately; no all-off claim is made.
    height: 690
    html: <article class="civica-card-demo " aria-labelledby="partial-group-title"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="partial-group-title">Living room lights</h2><p class="govuk-body"><strong>2 reported Off · 1 unavailable</strong></p><p class="govuk-body">Three example lights are configured. Two reported Off at <time datetime="2026-11-11T18:42:00+00:00">11 November 2026 at 18:42 GMT</time> (Europe/London). No current state is available for the third light.</p><a class="govuk-link" href="#partial-group-members">Review all three lights</a></div></article><section id="partial-group-members" tabindex="-1"><h2 class="govuk-heading-m" id="partial-group-members-heading">All three example lights</h2><ul class="govuk-list govuk-list--bullet"><li>Reading lamp — reported Off at 18:42 GMT on 11 November 2026.</li><li>Ceiling light — reported Off at 18:42 GMT on 11 November 2026.</li><li>Window lamp — unavailable; no current state.</li></ul><p class="govuk-body">Times use Europe/London. This example exposes no group-control action and does not treat the unavailable member as Off.</p></section>
  card-image-missing:
    title: A missing image does not remove the card
    description: The missing-media state is intentionally authored without a broken image URL. The room name, explanation and destination remain usable without an image or JavaScript.
    height: 650
    html: <article class="civica-card-demo " aria-labelledby="missing-image-title"><div class="civica-card-demo__fallback"><p class="govuk-body">Room image unavailable</p></div><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="missing-image-title"><a class="govuk-link" href="#missing-image-details">Garden room overview</a></h2><p class="govuk-body">The saved room image is unavailable in this specimen. You can still read the room information.</p><p class="govuk-body">A missing illustration does not mean the room’s devices are unavailable.</p></div></article><section id="missing-image-details" tabindex="-1"><h2 class="govuk-heading-m" id="missing-image-details-heading">Garden room overview</h2><p class="govuk-body">This synthetic room contains a lamp and a temperature sensor. Their current states are not supplied by this example; the failed image is a separate presentation issue.</p><p class="govuk-body">A production card should omit a failed decorative image. If the image carries necessary information, retain that information in text and explain that the image could not be shown.</p></section>
  card-long-name:
    title: A long user name and complete state label
    description: The supplied name is preserved instead of truncated. The card has no fixed height, and its details route stays separate from the value.
    height: 650
    html: '<article class="civica-card-demo " aria-labelledby="long-card-name"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="long-card-name">Nain’s reading lamp beside the bookcase in the living room</h2><p class="govuk-body"><strong>Last reported state: On</strong></p><p class="govuk-body">Reported at <time datetime="2026-11-11T18:42:00+00:00">11 November 2026 at 18:42 GMT</time> (Europe/London).</p><p class="govuk-body">The full household name is kept in the heading and details. It is not replaced by an entity ID or shortened to fit the card.</p><a class="govuk-link" href="#long-card-details">View details for Nain’s reading lamp</a></div></article><section id="long-card-details" tabindex="-1"><h2 class="govuk-heading-m" id="long-card-details-heading">Nain’s reading lamp details</h2><dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Name</dt><dd class="govuk-summary-list__value">Nain’s reading lamp beside the bookcase in the living room</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Area</dt><dd class="govuk-summary-list__value">Living room</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Example entity ID</dt><dd class="govuk-summary-list__value"><code>light.example_nains_reading_lamp</code></dd></div></dl><p class="govuk-body">This is a synthetic name and identifier. No real person or household is represented.</p></section>'
  card-image-information:
    title: An image supports a reading without becoming its state
    description: A schematic identifies the example room. The reading, unit, source time and uncertainty stay in ordinary text outside the artwork.
    height: 990
    html: '<article class="civica-card-demo " aria-labelledby="image-reading-title"><img class="civica-card-demo__media" src="../images/card-room-schematic.svg" width="640" height="360" alt="Invented layout: a sensor marker is in the larger room to the right of two smaller rooms."><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="image-reading-title">Living room temperature</h2><p class="govuk-body"><strong>20.5 °C</strong> — synthetic reported value.</p><p class="govuk-body">Reported at <time datetime="2026-11-11T18:42:00+00:00">11 November 2026 at 18:42 GMT</time> (Europe/London).</p><p class="govuk-body">The marker locates the example sensor in the larger room on the right. It is not a colour-coded warning and does not change with the reading.</p><a class="govuk-link" href="#image-reading-source">Read the example source information</a></div></article><section id="image-reading-source" tabindex="-1"><h2 class="govuk-heading-m" id="image-reading-source-heading">Example temperature source</h2><dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Measurement</dt><dd class="govuk-summary-list__value">Room air temperature</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Unit</dt><dd class="govuk-summary-list__value">Degrees Celsius</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Source</dt><dd class="govuk-summary-list__value">Invented living-room sensor</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Observation</dt><dd class="govuk-summary-list__value">11 November 2026 at 18:42 GMT, Europe/London</dd></div></dl><p class="govuk-body">A measured room temperature is not the heating target. This static card does not make a claim about the current household temperature.</p></section>'
    artwork:
      source: docs/data/card-artwork-provenance.json
      assets:
        - docs/source/images/card-room-schematic.svg
      alternative_text_decision: Use the per-image alt attribute in this specimen; any omitted/redundant meaning is fully present in its text.
  card-unknown-reading:
    title: Unknown and zero are different information states
    description: A complete sensor card explains that no usable reading has been supplied. Its details state what is known without manufacturing a measurement.
    height: 650
    html: <article class="civica-card-demo " aria-labelledby="unknown-reading-title"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="unknown-reading-title">Store room humidity</h2><p class="govuk-body"><strong>Reading unknown</strong></p><p class="govuk-body">The example entity has not supplied a usable humidity reading. There is no percentage or observation time to show.</p><a class="govuk-link" href="#unknown-reading-details">Read the humidity source details</a></div></article><section id="unknown-reading-details" tabindex="-1"><h2 class="govuk-heading-m" id="unknown-reading-details-heading">Humidity source details</h2><dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Expected measurement</dt><dd class="govuk-summary-list__value">Relative humidity</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Expected unit</dt><dd class="govuk-summary-list__value">Percent</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Current reading</dt><dd class="govuk-summary-list__value">Unknown</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Observation time</dt><dd class="govuk-summary-list__value">Not supplied</dd></div></dl><p class="govuk-body">Do not display 0% or substitute the page-load time. In a real installation, retain the integration’s actual unknown state until it supplies a reading.</p></section>

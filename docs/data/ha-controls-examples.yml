      <h1 class="govuk-heading-l" id="example-heading">A schedule that crosses midnight</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <div class="civica-table-scroll" tabindex="0" role="region" aria-label="Quiet-time schedule — Europe/London"><table class="govuk-table"><caption class="govuk-table__caption govuk-table__caption--m">Quiet-time schedule — Europe/London</caption><thead class="govuk-table__head"><tr><th scope="col" class="govuk-table__header">Day</th><th scope="col" class="govuk-table__header">Start</th><th scope="col" class="govuk-table__header">End</th></tr></thead><tbody class="govuk-table__body"><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Monday</th><td class="govuk-table__cell">22:00</td><td class="govuk-table__cell">24:00 (end of Monday)</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Tuesday</th><td class="govuk-table__cell">00:00</td><td class="govuk-table__cell">05:00</td></tr></tbody></table></div><p class="govuk-body">These touching blocks keep the schedule active across midnight. A single Monday block from 22:00 to 05:00 is not valid for the native weekly Schedule helper.</p><div class="govuk-inset-text">Clock changes can alter the elapsed duration of local-time schedules. Verify the installed helper and linked automation across the relevant daylight-saving transition; this example does not promise that a repeated hour runs twice.</div>
      </section>
  ha-schedule-conflict:
    title: Overlapping schedule blocks need review
    description: The invalid intervals are visible rather than silently merged.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">Overlapping schedule blocks need review</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <div class="civica-table-scroll" tabindex="0" role="region" aria-label="Draft Monday blocks — Europe/London"><table class="govuk-table"><caption class="govuk-table__caption govuk-table__caption--m">Draft Monday blocks — Europe/London</caption><thead class="govuk-table__head"><tr><th scope="col" class="govuk-table__header">Block</th><th scope="col" class="govuk-table__header">Interval</th><th scope="col" class="govuk-table__header">Problem</th></tr></thead><tbody class="govuk-table__body"><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">First</th><td class="govuk-table__cell">09:00 to 12:00</td><td class="govuk-table__cell">Overlaps the second block.</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Second</th><td class="govuk-table__cell">11:30 to 13:00</td><td class="govuk-table__cell">Starts before the first block ends.</td></tr></tbody></table></div><div class="govuk-inset-text">This draft cannot be represented as two overlapping native Schedule blocks. Change a boundary or explicitly decide which data applies; do not silently merge conflicting targets.</div><details class="govuk-details" id="conflict"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">Review the existing schedule</span></summary><div class="govuk-details__text"><p class="govuk-body">The last saved example schedule remains Monday 09:00 to 12:00. The proposed second block has not been saved. Cancel discards the draft only; it does not stop an automation already running.</p></div></details>
      </section>
  ha-schedule-timer:
    title: A paused timer and an all-day event
    description: Duration and calendar dates remain different quantities.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">A paused timer and an all-day event</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Laundry timer</dt><dd class="govuk-summary-list__value">Paused with 12 minutes remaining</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Timer observation</dt><dd class="govuk-summary-list__value">11 November 2026, 14:30 GMT</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Calendar event</dt><dd class="govuk-summary-list__value">Filter inspection — all day on 12 November 2026</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Calendar interpretation</dt><dd class="govuk-summary-list__value">Calendar date in Europe/London; no time-of-day claim</dd></div></dl><details class="govuk-details" id="timer-recovery"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">Timer recovery limits</span></summary><div class="govuk-details__text"><p class="govuk-body">A timer can restore its state when configured to do so. An automation listening for timer.finished does not run on startup for a timer that expired while Home Assistant was stopped. The timer alone does not confirm that an appliance completed its job.</p></div></details>
      </section>
  ha-history-values:
    title: Recorded temperature values
    description: A selected-period alternative preserves a missing interval.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">Recorded temperature values</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <p class="govuk-body">Synthetic Hall sensor history, 11 November 2026 from 14:00 to 14:15 GMT (Europe/London). These are recorded observations, not a current reading.</p><div class="civica-table-scroll" tabindex="0" role="region" aria-label="Hall temperature observations"><table class="govuk-table"><caption class="govuk-table__caption govuk-table__caption--m">Hall temperature observations</caption><thead class="govuk-table__head"><tr><th scope="col" class="govuk-table__header">Observation time</th><th scope="col" class="govuk-table__header">Temperature</th></tr></thead><tbody class="govuk-table__body"><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">14:00 GMT</th><td class="govuk-table__cell">18.5 °C</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">14:05 GMT</th><td class="govuk-table__cell">18.5 °C</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">14:10 GMT</th><td class="govuk-table__cell">Unavailable</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">14:15 GMT</th><td class="govuk-table__cell">19.0 °C</td></tr></tbody></table></div><p class="govuk-body">The unavailable record has not been interpolated. This static table demonstrates an equivalent presentation; it is not the Energy adapter’s View data control.</p>
      </section>
  ha-history-empty:
    title: No targets have been selected
    description: An empty selection is different from an empty data response.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">No targets have been selected</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <h2 class="govuk-heading-m">Choose what to review</h2><p class="govuk-body">No entities, devices or areas are selected in this example History view.</p><a class="govuk-link" href="#history-source-help">How to choose history sources</a><h2 class="govuk-heading-m" id="history-source-help">Choose history sources</h2><p class="govuk-body">In the current native History panel, use Sources and Add target. Select the actual targets and period. This example does not browse your installation or infer that it has no recorded data.</p>
      </section>
  ha-history-unavailable:
    title: A history request did not return data
    description: Configuration, absence and failure are separate cases.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">A history request did not return data</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <div class="civica-table-scroll" tabindex="0" role="region" aria-label="History review for 11 November 2026, 00:00 to 15:00 GMT"><table class="govuk-table"><caption class="govuk-table__caption govuk-table__caption--m">History review for 11 November 2026, 00:00 to 15:00 GMT</caption><thead class="govuk-table__head"><tr><th scope="col" class="govuk-table__header">Source</th><th scope="col" class="govuk-table__header">Result</th><th scope="col" class="govuk-table__header">Meaning</th></tr></thead><tbody class="govuk-table__body"><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Workshop sensor</th><td class="govuk-table__cell">Excluded from Recorder in this synthetic setup</td><td class="govuk-table__cell">No stored history is expected for this entity.</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">New utility sensor</th><td class="govuk-table__cell">Successful response with no records in the period</td><td class="govuk-table__cell">Do not label the period as zero usage.</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Hall sensor</th><td class="govuk-table__cell">Request failed</td><td class="govuk-table__cell">The records have not been obtained; their contents are unknown.</td></tr></tbody></table></div><details class="govuk-details" id="history-retry"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">Review before retrying</span></summary><div class="govuk-details__text"><p class="govuk-body">Keep the selected targets and period visible. A connected retry should request that same scope unless the person changes it. Do not generate a CSV download from missing data.</p></div></details>
      </section>
  ha-flow-values:
    title: Energy distribution as named flows
    description: Text gives direction and period without pretending to be an ONS Sankey.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">Energy distribution as named flows</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <p class="govuk-body">Synthetic energy distribution for 11 November 2026, 00:00 to 15:00 GMT (Europe/London). These values describe energy in kWh, not current power.</p><div class="civica-table-scroll" tabindex="0" role="region" aria-label="Selected-period flows"><table class="govuk-table"><caption class="govuk-table__caption govuk-table__caption--m">Selected-period flows</caption><thead class="govuk-table__head"><tr><th scope="col" class="govuk-table__header">Direction</th><th scope="col" class="govuk-table__header">Energy</th></tr></thead><tbody class="govuk-table__body"><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Grid to home</th><td class="govuk-table__cell">4.2 kWh</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Solar to home</th><td class="govuk-table__cell">2.1 kWh</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Solar to grid</th><td class="govuk-table__cell">0.8 kWh</td></tr></tbody></table></div><p class="govuk-body">This is a text review specimen for a native distribution diagram. It does not claim to include storage or all household losses, and its values must not be added to produce an unsupported total.</p>
      </section>
  ha-gauge-reading:
    title: A gauge with a named scale
    description: A native HTML meter illustrates a bounded reading and textual equivalent.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">A gauge with a named scale</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <label class="govuk-label" for="battery-meter">Backup battery charge</label><meter id="battery-meter" min="0" max="100" value="45">45%</meter><p class="govuk-body">Reported charge: 45% on a scale from 0% to 100%. Observed at 14:30 GMT on 11 November 2026.</p><p class="govuk-body">This reference uses the browser’s meter element, not a replacement Home Assistant Gauge card. No alarm threshold or remaining runtime is inferred from the percentage.</p>
      </section>
  ha-chart-unsupported:
    title: A chart outside the adapter contract
    description: A missing value and an unsupported chart engine remain explicit.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">A chart outside the adapter contract</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Card</dt><dd class="govuk-summary-list__value">Third-party water-flow chart — synthetic example</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Renderer</dt><dd class="govuk-summary-list__value">Not covered by the civica.uk Energy adapter</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Current flow rate</dt><dd class="govuk-summary-list__value">Unavailable</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Historical period</dt><dd class="govuk-summary-list__value">11 November 2026, 00:00 to 15:00 GMT</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Accessible data route</dt><dd class="govuk-summary-list__value">Must be assessed for this specific card</dd></div></dl><div class="govuk-inset-text">Matching theme colours do not establish adapter support. This example does not offer Energy View data or create a new chart.</div><details class="govuk-details" id="chart-review"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">What to record in a compatibility review</span></summary><div class="govuk-details__text"><p class="govuk-body">Record the card and renderer version, labels, keyboard controls, motion preference, missing data, units and any actual export or table. If values cannot be obtained accessibly, record that limitation.</p></div></details>
      </section>
  ha-account-scope:
    title: Know which setting will change
    description: Account, browser, dashboard and installation scope are separated.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">Know which setting will change</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <div class="civica-table-scroll" tabindex="0" role="region" aria-label="Settings review — synthetic household"><table class="govuk-table"><caption class="govuk-table__caption govuk-table__caption--m">Settings review — synthetic household</caption><thead class="govuk-table__head"><tr><th scope="col" class="govuk-table__header">Setting</th><th scope="col" class="govuk-table__header">Scope to verify</th><th scope="col" class="govuk-table__header">Effect</th></tr></thead><tbody class="govuk-table__body"><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Native localization preference</th><td class="govuk-table__cell">Signed-in account</td><td class="govuk-table__cell">How that account sees numbers and dates.</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Always hide the sidebar</th><td class="govuk-table__cell">This browser or companion app</td><td class="govuk-table__cell">Presentation on the current client.</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Saved dashboard configuration</th><td class="govuk-table__cell">That dashboard</td><td class="govuk-table__cell">What viewers of that dashboard see, subject to native access.</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Installation time zone</th><td class="govuk-table__cell">Home Assistant installation</td><td class="govuk-table__cell">A system configuration change; it is not just a display choice.</td></tr></tbody></table></div><p class="govuk-body">Use the actual installed version’s profile and settings labels. The documentation does not change any preference.</p>
      </section>
  ha-account-rejected:
    title: A settings request was rejected
    description: A visible control cannot override backend permissions.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">A settings request was rejected</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Task</dt><dd class="govuk-summary-list__value">Change installation settings</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Signed-in account</dt><dd class="govuk-summary-list__value">Non-administrator — synthetic account</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Result</dt><dd class="govuk-summary-list__value">Request rejected by Home Assistant</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Saved change</dt><dd class="govuk-summary-list__value">None confirmed</dd></div></dl><p class="govuk-body">Use an account with the required native permission or ask the installation administrator to review the change. Hiding the control or changing the theme cannot grant permission.</p><details class="govuk-details" id="account-help"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">Account and person are different</span></summary><div class="govuk-details__text"><p class="govuk-body">A user account allows sign-in. A person entity represents tracked presence. Linking them does not mean a presence report grants settings access.</p></div></details>
      </section>
  ha-account-shared:
    title: Review a shared display choice
    description: A new local display-policy question starts unanswered and does not change authorisation.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">Review a shared display choice</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <p class="govuk-body">No display policy is assumed. Choose an option to review this local example.</p><form data-demo-form data-demo-success="Example choice reviewed locally. No dashboard, account or access permission was changed."><fieldset class="govuk-fieldset"><legend class="govuk-fieldset__legend govuk-fieldset__legend--m">What should this example wall display show?</legend><div class="govuk-radios"><div class="govuk-radios__item"><input class="govuk-radios__input" id="display-detail0" name="display-detail" type="radio" value="device-summaries" required><label class="govuk-label govuk-radios__label" for="display-detail0">Household device summaries only</label></div><div class="govuk-radios__item"><input class="govuk-radios__input" id="display-detail1" name="display-detail" type="radio" value="chosen-personal-details"><label class="govuk-label govuk-radios__label" for="display-detail1">Household device summaries and chosen personal details</label></div></div></fieldset><button class="govuk-button" type="submit">Review example choice</button><p class="govuk-body" role="status" data-demo-status></p></form><div class="govuk-inset-text">A real display policy needs a verified implementation and household agreement. Dashboard visibility and CSS hiding are not backend access controls.</div>
      </section>
  ha-presence-reported:
    title: A tracker reports home
    description: The presence label states its evidence and observation time.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">A tracker reports home</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Person</dt><dd class="govuk-summary-list__value">Alex — invented name</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Presence</dt><dd class="govuk-summary-list__value">Reported home</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Source</dt><dd class="govuk-summary-list__value">Synthetic connection tracker</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Observation</dt><dd class="govuk-summary-list__value">11 November 2026, 14:30 GMT</dd></div></dl><p class="govuk-body">This report indicates the tracker’s state. It does not prove the person is physically present, awake or able to respond.</p><details class="govuk-details" id="presence-detail"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">How to read this state</span></summary><div class="govuk-details__text"><p class="govuk-body">The tracked person is separate from a login account. A signed-in browser does not establish presence, and a presence report does not grant permission.</p></div></details>
      </section>
  ha-presence-missing:
    title: Presence cannot be determined
    description: Missing tracker data does not become away.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">Presence cannot be determined</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Person</dt><dd class="govuk-summary-list__value">Sam — invented name</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Current presence</dt><dd class="govuk-summary-list__value">Unknown</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Last available report</dt><dd class="govuk-summary-list__value">Home at 13:00 GMT on 11 November 2026</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Reason for missing update</dt><dd class="govuk-summary-list__value">Not supplied</dd></div></dl><div class="govuk-inset-text">Do not label Sam as away or the home as empty. This retained report is not a current location.</div><p class="govuk-body">The example omits exact coordinates, routes and a personal photograph.</p>
      </section>
  ha-presence-private:
    title: A shared display with limited detail
    description: A fixed privacy presentation shows a deliberate disclosure boundary.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">A shared display with limited detail</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <h2 class="govuk-heading-m">Household overview</h2><p class="govuk-body">Personal locations are not shown on this example display.</p><dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Presence detail</dt><dd class="govuk-summary-list__value">Omitted from this presentation</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Device summary</dt><dd class="govuk-summary-list__value">3 configured room sensors</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Authorisation</dt><dd class="govuk-summary-list__value">Still governed by the native account</dd></div></dl><details class="govuk-details" id="privacy-choice"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">About this display choice</span></summary><div class="govuk-details__text"><p class="govuk-body">This specimen illustrates a household-chosen presentation policy. It does not implement a location privacy setting, redact backend data or prevent another permitted route from showing it. Agree the actual display scope and test the implementation before use.</p></div></details>
      </section>
  ha-camera-snapshot:
    title: A timestamped camera still
    description: A simple original diagram stands in for a synthetic still, with no live-feed claim.
    height: 650
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">A timestamped camera still</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <figure class="civica-image"><img src="../images/ha-controls-camera-scene.svg" width="640" height="360" alt="Invented porch scene: a closed door and a parcel on the floor. This is a diagram, not camera evidence."><figcaption class="govuk-body">Synthetic snapshot specimen. Example capture time: 11 November 2026, 14:30 GMT. The diagram contains no real household image.</figcaption></figure><dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Display type</dt><dd class="govuk-summary-list__value">Still image</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Stream</dt><dd class="govuk-summary-list__value">Not connected in this example</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Recording status</dt><dd class="govuk-summary-list__value">Not provided</dd></div></dl><p class="govuk-body">The capture label illustrates a timestamped still. It does not establish the current condition of a real entrance.</p>
      </section>
    artwork:
      creator: civica.uk project; Codex-assisted original SVG geometry
      licence: MIT; original documentation artwork under the repository LICENSE
      source: docs/source/images/ha-controls-camera-scene.svg
      provenance: Original rectangular geometry. No imported brand paths, photograph or household data.
      purpose: Illustrate the label and timestamp of a synthetic snapshot without exposing a real camera image.
      intended_background: "Fixed light #F3F6F9 image canvas with neutral ink, grey and supplied Civic Cobalt; no operational colour coding."
      alternative_text_decision: Meaningful alt text identifies the invented door and parcel and explicitly distinguishes the diagram from camera evidence.
      review_status: Source and semantic checks only; rendered review is recorded separately by the integrated documentation checks.
      sha256: 0c7fd17ac0ac4908864001eb35c9db9b1da89cbd7d156580b2d29a6cbb7b72c2
  ha-camera-loading:
    title: A stream is loading
    description: Loading feedback does not relabel an old image as live.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">A stream is loading</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Camera</dt><dd class="govuk-summary-list__value">Porch camera — synthetic example</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Viewer status</dt><dd class="govuk-summary-list__value">Loading stream</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Last available still</dt><dd class="govuk-summary-list__value">Captured at 14:25 GMT on 11 November 2026</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Current example time</dt><dd class="govuk-summary-list__value">14:30 GMT on 11 November 2026</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Camera entity state</dt><dd class="govuk-summary-list__value">Idle; this example integration does not report recording activity</dd></div></dl><div class="govuk-inset-text">No live image is available in this specimen. An Idle entity state alone does not prove that the physical camera is not recording.</div><details class="govuk-details" id="camera-help"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">What the viewer should preserve</span></summary><div class="govuk-details__text"><p class="govuk-body">Keep the native stream controls and error reporting. If an old still remains visible while loading, label its capture time and do not add a Live badge.</p></div></details>
      </section>
  ha-camera-failed:
    title: A stream could not be opened
    description: A failure and a permission boundary have distinct explanations.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">A stream could not be opened</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <h2 class="govuk-heading-m">Porch stream unavailable</h2><p class="govuk-body">The example viewer did not receive a playable stream. The reason is not supplied. No image is shown.</p><button class="govuk-button govuk-button--secondary" type="button" data-demo-message="Example only: a connected retry would try to reopen the viewer stream. It would not change recording, disable privacy mode or bypass authorisation. No request was made.">Preview retry explanation</button><p class="govuk-body" role="status" data-demo-status></p><details class="govuk-details" id="camera-permission"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">If access is denied instead</span></summary><div class="govuk-details__text"><p class="govuk-body">Show the actual native authorisation result and retain its sign-in or permission route. Do not replace it with a claim that the camera is offline or expose a direct unauthenticated image URL.</p></div></details>
      </section>

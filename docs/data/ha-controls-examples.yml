examples:
  ha-state-zero:
    title: A reported zero is a reading
    description: A valid zero with its quantity, source observation time and missing optional attribute.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">A reported zero is a reading</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Device</dt><dd class="govuk-summary-list__value">Kitchen socket</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Power</dt><dd class="govuk-summary-list__value">0 W</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Observed at</dt><dd class="govuk-summary-list__value">11 November 2026, 14:30 GMT (Europe/London)</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Source</dt><dd class="govuk-summary-list__value">Synthetic socket meter</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Voltage</dt><dd class="govuk-summary-list__value">Not provided</dd></div></dl><details class="govuk-details" id="source"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">About the observation</span></summary><div class="govuk-details__text"><p class="govuk-body">The source supplied an observation timestamp. The device name and power value are retained even though voltage is not provided. A zero reading does not establish that the socket is switched off.</p></div></details>
      </section>
  ha-state-missing:
    title: Different reasons for missing information
    description: Unknown, unavailable and an absent attribute remain distinct.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">Different reasons for missing information</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <div class="civica-table-scroll" tabindex="0" role="region" aria-label="Readings at 14:30 GMT on 11 November 2026"><table class="govuk-table"><caption class="govuk-table__caption govuk-table__caption--m">Readings at 14:30 GMT on 11 November 2026</caption><thead class="govuk-table__head"><tr><th scope="col" class="govuk-table__header">Entity</th><th scope="col" class="govuk-table__header">Reported information</th><th scope="col" class="govuk-table__header">Meaning</th></tr></thead><tbody class="govuk-table__body"><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Hall sensor</th><td class="govuk-table__cell">Unknown</td><td class="govuk-table__cell">The entity has not supplied a value.</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Garage sensor</th><td class="govuk-table__cell">Unavailable</td><td class="govuk-table__cell">The entity cannot provide its state. The reason is not supplied.</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Kitchen sensor</th><td class="govuk-table__cell">19.5 °C; humidity not provided</td><td class="govuk-table__cell">Temperature is valid. The optional humidity attribute is absent.</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Bathroom climate</th><td class="govuk-table__cell">Measured humidity not provided; target 55%</td><td class="govuk-table__cell">The current_humidity attribute is explicitly null. The target remains a separate valid setting.</td></tr></tbody></table></div><p class="govuk-body">No missing value has been replaced with 0. These records do not establish whether any device is offline.</p>
      </section>
  ha-state-assumed:
    title: A state that is not confirmed
    description: An assumed light state and a retained reading use different qualifications.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">A state that is not confirmed</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Porch light</dt><dd class="govuk-summary-list__value">Assumed on</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Confirmation</dt><dd class="govuk-summary-list__value">This synthetic integration does not report whether the light is on.</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Greenhouse temperature</dt><dd class="govuk-summary-list__value">Last reading: 12.5 °C</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Observation time</dt><dd class="govuk-summary-list__value">11 November 2026, 13:00 GMT (Europe/London)</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Review time</dt><dd class="govuk-summary-list__value">11 November 2026, 14:30 GMT (Europe/London)</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Freshness rule</dt><dd class="govuk-summary-list__value">This example source promises a reading every 5 minutes; none has arrived for 90 minutes.</dd></div></dl><div class="govuk-inset-text">The retained temperature is not a current reading. The assumed light state is not a physical confirmation.</div>
      </section>
  ha-action-request:
    title: Review a lighting request
    description: A local preview explains the action without reporting physical success.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">Review a lighting request</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Target</dt><dd class="govuk-summary-list__value">Reading lamp</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Last reported state</dt><dd class="govuk-summary-list__value">Off at 14:30 GMT on 11 November 2026</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Proposed action</dt><dd class="govuk-summary-list__value">Turn on the reading lamp</dd></div></dl><button class="govuk-button govuk-button--secondary" type="button" data-demo-message="Example feedback: the turn-on request would be sent. A separate reported-state update is needed to confirm the lamp is on. No command was sent.">Preview request feedback</button><p class="govuk-body" role="status" data-demo-status></p>
      </section>
  ha-action-pending:
    title: A request has no confirmed result
    description: Pending and timeout copy keep the previous reported state visible.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">A request has no confirmed result</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Target</dt><dd class="govuk-summary-list__value">Porch light</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Request</dt><dd class="govuk-summary-list__value">Turn on, sent at 14:30:00 GMT on 11 November 2026</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Last reported state</dt><dd class="govuk-summary-list__value">Off, observed at 14:29:58 GMT</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Result</dt><dd class="govuk-summary-list__value">No confirmed result by 14:30:20 GMT</dd></div></dl><div class="govuk-inset-text">The light may still turn on. Check its current state before sending another request.</div><details class="govuk-details" id="options"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">What can I do next?</span></summary><div class="govuk-details__text"><p class="govuk-body">In a connected interface, return to the native device details to check for a new reported state. Closing this message does not cancel a command already sent. This example has no connection or retry action.</p></div></details>
      </section>
  ha-action-partial:
    title: A room action has mixed results
    description: Member-level results avoid claiming that the whole room changed.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">A room action has mixed results</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <p class="govuk-body">Synthetic request: turn off three study lights at 14:30 GMT on 11 November 2026.</p><div class="civica-table-scroll" tabindex="0" role="region" aria-label="Results checked at 14:30:10 GMT"><table class="govuk-table"><caption class="govuk-table__caption govuk-table__caption--m">Results checked at 14:30:10 GMT</caption><thead class="govuk-table__head"><tr><th scope="col" class="govuk-table__header">Light</th><th scope="col" class="govuk-table__header">Outcome</th><th scope="col" class="govuk-table__header">Evidence</th></tr></thead><tbody class="govuk-table__body"><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Desk lamp</th><td class="govuk-table__cell">Reported off</td><td class="govuk-table__cell">New state at 14:30:01 GMT</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Shelf light</th><td class="govuk-table__cell">Request rejected</td><td class="govuk-table__cell">The integration returned an action error.</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Ceiling light</th><td class="govuk-table__cell">Not confirmed</td><td class="govuk-table__cell">No new report after the request.</td></tr></tbody></table></div><p class="govuk-body">1 light reported off; 1 request was rejected; 1 result is not confirmed.</p><details class="govuk-details" id="retry"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">Before retrying</span></summary><div class="govuk-details__text"><p class="govuk-body">Review the affected member and the current state. Do not repeat the completed action automatically. A retry for the ceiling light could duplicate a request that is still completing.</p></div></details>
      </section>
  ha-control-range:
    title: Adjust a brightness draft
    description: A native range updates a visible percentage locally; submission does not control a light.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">Adjust a brightness draft</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <form data-demo-form data-demo-success="Example checked in this page only. Nothing was saved and no device command was sent."><label class="govuk-label" for="level">Brightness draft</label><p class="govuk-hint" id="level-hint">Use the arrow keys to adjust from 1% to 100%, in steps of 1%. This is a draft, not a reported device value.</p><input class="civica-control-range" id="level" name="level" type="range" min="1" max="100" step="1" value="40" aria-describedby="level-hint" data-demo-range><p class="govuk-body">Draft: <output for="level" data-demo-range-output>40%</output></p><button class="govuk-button" type="submit">Check brightness draft</button><p class="govuk-body" role="status" data-demo-status></p></form>
      </section>
  ha-control-precise:
    title: Enter a precise target
    description: Decimal steps and limits are declared for this synthetic control.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">Enter a precise target</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <form data-demo-form data-demo-success="Example checked in this page only. Nothing was saved and no device command was sent."><div class="govuk-form-group"><label class="govuk-label" for="temperature">Target temperature (°C)</label><div class="govuk-hint" id="temperature-hint">This example device accepts 7°C to 30°C in 0.5°C steps. The current measured temperature is 18.5°C.</div><input class="govuk-input govuk-input--width-10" id="temperature" name="temperature" type="number" value="19.5" aria-describedby="temperature-hint" min="7" max="30" step="0.5" required></div><button class="govuk-button" type="submit">Check temperature draft</button><p class="govuk-body" role="status" data-demo-status></p></form>
      </section>
  ha-control-missing:
    title: Unavailable volume and a visible details route
    description: A missing numeric value is text, not a slider thumb at zero.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">Unavailable volume and a visible details route</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Device</dt><dd class="govuk-summary-list__value">Kitchen speaker</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Volume</dt><dd class="govuk-summary-list__value">Unavailable</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Playback</dt><dd class="govuk-summary-list__value">Unknown</dd></div></dl><p class="govuk-body">Volume cannot be changed while the current control is unavailable.</p><a class="govuk-link" href="#speaker-help">Read the speaker control guidance</a><h2 class="govuk-heading-m" id="speaker-help">Speaker control guidance</h2><p class="govuk-body">A connected dashboard should keep its native More info route visible. Do not make this essential route available only by holding or double-tapping a card. The example does not diagnose a connection fault.</p>
      </section>
  ha-light-switch:
    title: An on/off-only light
    description: The example does not invent dimming or colour support.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">An on/off-only light</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Light</dt><dd class="govuk-summary-list__value">Utility light</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Reported state</dt><dd class="govuk-summary-list__value">Off</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Observation</dt><dd class="govuk-summary-list__value">11 November 2026, 14:30 GMT</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Supported control</dt><dd class="govuk-summary-list__value">On and off only</dd></div></dl><button class="govuk-button govuk-button--secondary" type="button" data-demo-message="Example only: a connected control would request Utility light on. Brightness and colour are not supported by this example entity. No command was sent.">Preview turn-on request</button><p class="govuk-body" role="status" data-demo-status></p>
      </section>
  ha-light-temperature:
    title: A colour-temperature draft
    description: A tunable-white light uses its own kelvin range, not brand palette choices.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">A colour-temperature draft</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Light</dt><dd class="govuk-summary-list__value">Desk lamp</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Reported setting</dt><dd class="govuk-summary-list__value">3,000 K at 60% brightness</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Observation</dt><dd class="govuk-summary-list__value">11 November 2026, 14:30 GMT</dd></div></dl><form data-demo-form data-demo-success="Example checked in this page only. Nothing was saved and no device command was sent."><div class="govuk-form-group"><label class="govuk-label" for="kelvin">Colour temperature (K)</label><div class="govuk-hint" id="kelvin-hint">This synthetic lamp accepts 2,700 K to 6,500 K. This field changes the draft only.</div><input class="govuk-input govuk-input--width-10" id="kelvin" name="kelvin" type="number" value="3000" aria-describedby="kelvin-hint" min="2700" max="6500" step="100" required></div><button class="govuk-button" type="submit">Check light setting</button><p class="govuk-body" role="status" data-demo-status></p></form><p class="govuk-body">Changing Civic Cobalt to Racing Moss in theme settings changes the interface, not this lamp.</p>
      </section>
  ha-light-mixed:
    title: A room with different light capabilities
    description: A mixed group keeps unavailable and unsupported members visible.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">A room with different light capabilities</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <div class="civica-table-scroll" tabindex="0" role="region" aria-label="Study lights at 14:30 GMT on 11 November 2026"><table class="govuk-table"><caption class="govuk-table__caption govuk-table__caption--m">Study lights at 14:30 GMT on 11 November 2026</caption><thead class="govuk-table__head"><tr><th scope="col" class="govuk-table__header">Light</th><th scope="col" class="govuk-table__header">Reported state</th><th scope="col" class="govuk-table__header">Available controls</th></tr></thead><tbody class="govuk-table__body"><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Desk lamp</th><td class="govuk-table__cell">On, 60%, 3,000 K</td><td class="govuk-table__cell">Brightness and colour temperature</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Shelf light</th><td class="govuk-table__cell">Off</td><td class="govuk-table__cell">On and off</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Ceiling light</th><td class="govuk-table__cell">Unavailable</td><td class="govuk-table__cell">No current command offered</td></tr></tbody></table></div><p class="govuk-body">The room has mixed states. A colour-temperature request can target only the desk lamp; it must not appear to change all three lights.</p><details class="govuk-details" id="room-detail"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">Review the room action scope</span></summary><div class="govuk-details__text"><p class="govuk-body">A connected room control must disclose whether it targets all members or only compatible available members. Keep excluded members listed and report partial results individually.</p></div></details>
      </section>
  ha-climate-target:
    title: Measured temperature and a target
    description: The setting and heating activity have separate labels.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">Measured temperature and a target</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Room</dt><dd class="govuk-summary-list__value">Living room</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Measured temperature</dt><dd class="govuk-summary-list__value">18.5 °C</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Selected mode</dt><dd class="govuk-summary-list__value">Heat</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Reported activity</dt><dd class="govuk-summary-list__value">Idle</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Observed at</dt><dd class="govuk-summary-list__value">11 November 2026, 14:30 GMT</dd></div></dl><form data-demo-form data-demo-success="Example checked in this page only. Nothing was saved and no device command was sent."><div class="govuk-form-group"><label class="govuk-label" for="target">Target temperature (°C)</label><div class="govuk-hint" id="target-hint">Synthetic supported range: 7°C to 30°C, in 0.5°C steps.</div><input class="govuk-input govuk-input--width-10" id="target" name="target" type="number" value="20" aria-describedby="target-hint" min="7" max="30" step="0.5" required></div><button class="govuk-button" type="submit">Check target draft</button><p class="govuk-body" role="status" data-demo-status></p></form>
      </section>
  ha-climate-range:
    title: Review a heating and cooling range
    description: Two setpoints retain their own meaning and declared ordering.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">Review a heating and cooling range</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Device</dt><dd class="govuk-summary-list__value">Study heat pump</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Selected mode</dt><dd class="govuk-summary-list__value">Heat/Cool</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Lower target</dt><dd class="govuk-summary-list__value">19 °C</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Upper target</dt><dd class="govuk-summary-list__value">23 °C</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Measured temperature</dt><dd class="govuk-summary-list__value">21 °C</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Reported activity</dt><dd class="govuk-summary-list__value">Idle</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Observed at</dt><dd class="govuk-summary-list__value">11 November 2026, 14:30 GMT</dd></div></dl><details class="govuk-details" id="range-help"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">Why two targets?</span></summary><div class="govuk-details__text"><p class="govuk-body">The lower and upper targets define this example device’s operating range. A connected control must enforce the device’s supported ordering and separation. It must not silently swap the targets or force a universal gap.</p></div></details>
      </section>
  ha-climate-pending:
    title: A new target is not yet confirmed
    description: The requested value is not substituted for a missing measurement.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">A new target is not yet confirmed</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Device</dt><dd class="govuk-summary-list__value">Bedroom thermostat</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Measured temperature</dt><dd class="govuk-summary-list__value">Unavailable</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Last reported target</dt><dd class="govuk-summary-list__value">19 °C at 14:29 GMT on 11 November 2026</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Requested target</dt><dd class="govuk-summary-list__value">20 °C at 14:30 GMT</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Request result</dt><dd class="govuk-summary-list__value">Not confirmed</dd></div></dl><div class="govuk-inset-text">The target may still change. A missing temperature does not mean the room is at 0°C or that heating is off.</div><p class="govuk-body">This example does not offer Cooling because that mode is not supplied by the device.</p>
      </section>
  ha-climate-related:
    title: Fan, humidity and water-heater settings
    description: Related domains keep measurements, presets and targets distinct.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">Fan, humidity and water-heater settings</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>

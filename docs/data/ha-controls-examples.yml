  ha-automation-outline:
    title: Read an automation before editing
    description: A simple outline separates triggers, conditions and actions from interface error handling.
    height: 540
    html: |
      <section aria-labelledby="example-heading">
      <h1 class="govuk-heading-l" id="example-heading">Read an automation before editing</h1>
      <p class="govuk-body">Synthetic example. All names, readings and dates are invented. This page is not connected to Home Assistant.</p>
      <h2 class="govuk-heading-m">Evening study light — draft</h2><ol class="govuk-list govuk-list--number"><li><strong>Trigger:</strong> the evening schedule becomes active.</li><li><strong>Condition:</strong> the study light reports Off.</li><li><strong>Action:</strong> request that the study light turns on.</li></ol><p class="govuk-body">Interface feedback is separate from this automation: if the request fails, retain its supplied error for review. No error-recovery action is configured by this outline.</p><div class="govuk-inset-text">Saving this draft, enabling future triggers and running the action are separate operations.</div><details class="govuk-details" id="editor-route"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">Native editing route</span></summary><div class="govuk-details__text"><p class="govuk-body">Use Settings > Automations & scenes and the actual automation editor. This simplified outline does not execute YAML or create an automation.</p></div></details>
      </section>

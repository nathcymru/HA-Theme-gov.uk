    "system-history-expanded": {
      "title": "A guide with an update",
      "html": "<section aria-label=\"Example publication details\"><h2 class=\"govuk-heading-m\">Example heating guide</h2><p class=\"govuk-body\">Published <time datetime=\"2026-10-01\">1 October 2026</time><br>Last updated <time datetime=\"2026-11-01\">1 November 2026</time></p><details class=\"govuk-details\"><summary class=\"govuk-details__summary\"><span class=\"govuk-details__summary-text\">See all updates</span></summary><div class=\"govuk-details__text\"><ol class=\"govuk-list\"><li><time datetime=\"2026-11-01\">1 November 2026</time><p>Clarified how to identify the active schedule.</p></li><li><time datetime=\"2026-10-01\">1 October 2026</time><p>First published.</p></li></ol></div></details></section>",
      "height": 300,
      "description": "Dates and notes in this example are fictional."
    },
    "system-history-correction": {
      "title": "A corrected guide",
      "html": "<section aria-label=\"Example publication details\"><h2 class=\"govuk-heading-m\">Example meter guide</h2><p class=\"govuk-body\">Published <time datetime=\"2026-10-01\">1 October 2026</time><br>Last updated <time datetime=\"2026-11-01\">1 November 2026</time></p><details class=\"govuk-details\"><summary class=\"govuk-details__summary\"><span class=\"govuk-details__summary-text\">See all updates</span></summary><div class=\"govuk-details__text\"><ol class=\"govuk-list\"><li><time datetime=\"2026-11-01\">1 November 2026</time><p>Corrected the unit in the example from W to kW.</p></li><li><time datetime=\"2026-10-01\">1 October 2026</time><p>First published.</p></li></ol></div></details></section>",
      "height": 300,
      "description": "An update note identifies the correction instead of saying only \u201cUpdated\u201d."
    }
  }

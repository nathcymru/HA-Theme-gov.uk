examples:
  pub-components-attachment-1:
    title: "Manual preview"
    description: "A local HTML manual extract; no file download is implied."
    html: |
      <h2 class="govuk-heading-m">Sample lamp instructions</h2>
      <p class="govuk-body">
      <a class="govuk-link" href="#manual">Read the lamp instructions</a> (HTML)</p>
      <section id="manual" tabindex="-1">
      <h2 class="govuk-heading-m">Lamp instructions</h2>
      <p class="govuk-body">This invented lamp example illustrates the document layout. Use the instructions supplied with the real product.</p>
      </section>
  pub-components-attachment-2:
    title: "Revision and format"
    description: "A document entry with meaningful revision information and a local text alternative."
    html: |
      <h2 class="govuk-heading-m">Sample maintenance notes</h2>
      <dl class="govuk-summary-list">
      <div class="govuk-summary-list__row">
      <dt class="govuk-summary-list__key">Format</dt>
      <dd class="govuk-summary-list__value">HTML</dd>
      </div>
      <div class="govuk-summary-list__row">
      <dt class="govuk-summary-list__key">Revision</dt>
      <dd class="govuk-summary-list__value">Example revision 2</dd>
      </div>
      <div class="govuk-summary-list__row">
      <dt class="govuk-summary-list__key">Language</dt>
      <dd class="govuk-summary-list__value">English</dd>
      </div>
      </dl>
      <p class="govuk-body">
      <a class="govuk-link" href="#notes">View maintenance notes</a>
      </p>
      <section id="notes" tabindex="-1">
      <h2 class="govuk-heading-m">Maintenance notes</h2>
      <p class="govuk-body">Record the date and outcome of each inspection in the real maintenance system. No inspection is recorded by this example.</p>
      </section>
  pub-components-breadcrumbs-1:
    title: "Two-level help trail"
    description: "Working in-page destinations illustrate a help hierarchy."
    html: |
      <nav aria-label="Help breadcrumbs">
      <ul class="govuk-list">
      <li>
      <a class="govuk-link" href="#help">Help</a>
      </li>
      <li>
      <a class="govuk-link" href="#lights">Lighting</a>
      </li>
      </ul>
      </nav>
      <section id="help" tabindex="-1">
      <h2 class="govuk-heading-m">Help</h2>
      <p class="govuk-body">Choose a subject for household guidance.</p>
      </section>
      <section id="lights" tabindex="-1">
      <h2 class="govuk-heading-m">Lighting</h2>
      <p class="govuk-body">This section contains sample lighting guidance.</p>
      </section>
  pub-components-breadcrumbs-2:
    title: "Current page shown"
    description: "The current item is plain text with aria-current."
    html: |
      <nav aria-label="Manual breadcrumbs">
      <ol class="govuk-list">
      <li>
      <a class="govuk-link" href="#manuals">Manuals</a>
      </li>
      <li aria-current="page">Heating timer</li>
      </ol>
      </nav>
      <section id="manuals" tabindex="-1">
      <h2 class="govuk-heading-m">Manuals</h2>
      <p class="govuk-body">Sample collection of equipment instructions.</p>
      </section>
  pub-components-content-list-1:
    title: "Installation contents"
    description: "Three working section links inside the example."
    html: |
      <nav aria-label="On this page">
      <ul class="govuk-list">
      <li>
      <a class="govuk-link" href="#prepare">Prepare</a>
      </li>
      <li>
      <a class="govuk-link" href="#install">Install</a>
      </li>
      <li>
      <a class="govuk-link" href="#check">Check the result</a>
      </li>
      </ul>
      </nav>
      <section id="prepare" tabindex="-1">
      <h2 class="govuk-heading-m">Prepare</h2>
      <p class="govuk-body">Read the current installation requirements.</p>
      </section>
      <section id="install" tabindex="-1">
      <h2 class="govuk-heading-m">Install</h2>
      <p class="govuk-body">Use the installation method that matches your setup.</p>
      </section>
      <section id="check" tabindex="-1">
      <h2 class="govuk-heading-m">Check the result</h2>
      <p class="govuk-body">Confirm the selected theme and companion version.</p>
      </section>
  pub-components-content-list-2:
    title: "Short recovery guide"
    description: "Use only the sections needed for a bounded task."
    html: |
      <nav aria-label="Recovery guide contents">
      <ul class="govuk-list">
      <li>
      <a class="govuk-link" href="#symptom">Identify the symptom</a>
      </li>
      <li>
      <a class="govuk-link" href="#restore">Restore the previous version</a>
      </li>
      </ul>
      </nav>
      <section id="symptom" tabindex="-1">
      <h2 class="govuk-heading-m">Identify the symptom</h2>
      <p class="govuk-body">Record what stopped working and whether the native theme works.</p>
      </section>
      <section id="restore" tabindex="-1">
      <h2 class="govuk-heading-m">Restore the previous version</h2>
      <p class="govuk-body">Follow the verified recovery instructions for the installed version.</p>
      </section>
  pub-components-emergency-banner-1:
    title: "Urgent-message specimen"
    description: "Static fictional message; this is not a live household alert."
    html: |
      <div class="govuk-notification-banner" role="region" aria-labelledby="alert-title">
      <div class="govuk-notification-banner__header">
      <h2 class="govuk-notification-banner__title" id="alert-title">Example urgent message</h2>
      </div>
      <div class="govuk-notification-banner__content">
      <p class="govuk-notification-banner__heading">A sample alert requires attention</p>
      <p class="govuk-body">Source: demonstration only. No current condition is being reported.</p>
      </div>
      </div>
  pub-components-emergency-banner-2:
    title: "Stale source"
    description: "Unknown freshness must remain explicit."
    html: |
      <h2 class="govuk-heading-m">Example alert source unavailable</h2>
      <dl class="govuk-summary-list">
      <div class="govuk-summary-list__row">
      <dt class="govuk-summary-list__key">Source</dt>
      <dd class="govuk-summary-list__value">Demonstration sensor</dd>
      </div>
      <div class="govuk-summary-list__row">
      <dt class="govuk-summary-list__key">Current reading</dt>
      <dd class="govuk-summary-list__value">Unavailable</dd>
      </div>
      <div class="govuk-summary-list__row">
      <dt class="govuk-summary-list__key">Meaning</dt>
      <dd class="govuk-summary-list__value">The example cannot establish the current condition</dd>
      </div>
      </dl>
  pub-components-feedback-1:
    title: "Local feedback interaction"
    description: "Type invented feedback. The demonstration does not send or save it."
    html: |
      <form data-demo-form>
      <div class="govuk-form-group">
      <label class="govuk-label" for="sample-input">What could be clearer?</label>
      <div id="sample-hint" class="govuk-hint">Example only: nothing is sent or stored.</div>
      <input class="govuk-input" type="text" id="sample-input" name="sample" aria-describedby="sample-hint">
      </div>
      <button type="submit" class="govuk-button">Check example</button>
      <p class="govuk-body" data-demo-status role="status">
      </p>
      </form>
  pub-components-feedback-2:
    title: "Public issue route"
    description: "This real repository link opens the public issue list."
    html: |
      <h2 class="govuk-heading-m">Report a documentation problem</h2>
      <p class="govuk-body">Do not include passwords, tokens or household details in a public report.</p>
      <p class="govuk-body">
      <a class="govuk-link" href="https://github.com/nathcymru/HA-Theme-gov.uk/issues">Open the civica.uk repository issues</a>
      </p>
  pub-components-global-banner-1:
    title: "Planned maintenance message"
    description: "Static, fictional maintenance information with a working detail anchor."
    html: |
      <h2 class="govuk-heading-m">Example service notice</h2>
      <p class="govuk-body">A demonstration maintenance window is planned. No live outage is announced.</p>
      <p class="govuk-body">
      <a class="govuk-link" href="#maintenance">Read the example maintenance scope</a>
      </p>
      <section id="maintenance" tabindex="-1">
      <h2 class="govuk-heading-m">Maintenance scope</h2>
      <p class="govuk-body">Only this documentation example is affected; no household service changes.</p>
      </section>
  pub-components-global-banner-2:
    title: "Dismissal semantics"
    description: "The button reports local demonstration activity; it does not change a saved preference."
    html: |
      <h2 class="govuk-heading-m">Example update information</h2>
      <p class="govuk-body">A message may offer a dismissal when it is safe to do so.</p>
      <button type="button" class="govuk-button govuk-button--secondary" data-demo-message="Example acknowledged locally. No notification preference was changed.">Acknowledge example</button>
      <p class="govuk-body" data-demo-status role="status">
      </p>
  pub-components-previous-and-next-navigation-1:
    title: "Between chapters"
    description: "Previous and next links resolve to labelled sections."
    html: |
      <nav aria-label="Guide pages">
      <ul class="govuk-list">
      <li>
      <a class="govuk-link" href="#before">Previous: Prepare Home Assistant</a>
      </li>
      <li>
      <a class="govuk-link" href="#after">Next: Verify the theme</a>
      </li>
      </ul>
      </nav>
      <section id="before" tabindex="-1">
      <h2 class="govuk-heading-m">Prepare Home Assistant</h2>
      <p class="govuk-body">Check the supported version and installation requirements.</p>
      </section>
      <section id="after" tabindex="-1">
      <h2 class="govuk-heading-m">Verify the theme</h2>
      <p class="govuk-body">Check the theme selector and the native Energy route.</p>
      </section>
  pub-components-previous-and-next-navigation-2:
    title: "First chapter"
    description: "Only a valid next destination is provided."
    html: |
      <nav aria-label="Guide pages">
      <ul class="govuk-list">
      <li>
      <a class="govuk-link" href="#next">Next: Choose the installation method</a>
      </li>
      </ul>
      </nav>
      <section id="next" tabindex="-1">
      <h2 class="govuk-heading-m">Choose the installation method</h2>
      <p class="govuk-body">Select the instructions matching HACS or the manual package.</p>
      </section>
  pub-components-print-link-1:
    title: "Print a recovery note"
    description: "The button opens the browser print dialog for this isolated example. It does not upload a file or claim that printing succeeded."
    html: |
      <h2 class="govuk-heading-m">Example recovery note</h2>
      <p class="govuk-body">Keep the verified recovery instructions with the installed version. This fictional note contains no credentials or household configuration.</p>
      <div class="govuk-!-display-none-print">
      <button type="button" class="govuk-button govuk-button--secondary" data-publishing-print data-publishing-status="print-status" disabled>Print this example</button>
      <p class="govuk-body" id="print-status" role="status">
      </p>
      <noscript>
      <p class="govuk-body">Use your browser’s Print command. The example button needs JavaScript.</p>
      </noscript>
      </div>
  pub-components-print-link-2:
    title: "Print a structured reference"
    description: "A second example preserves clear labels and explanatory content in the browser print preview."
    html: |
      <h2 class="govuk-heading-m">Example installation reference</h2>
      <p class="govuk-body">Check the supported frontend version, installation ownership and recovery instructions before an upgrade.</p>
      <div class="govuk-!-display-none-print">
      <button type="button" class="govuk-button govuk-button--secondary" data-publishing-print data-publishing-status="print-status" disabled>Print this example</button>
      <p class="govuk-body" id="print-status" role="status">
      </p>
      <noscript>
      <p class="govuk-body">Use your browser’s Print command. The example button needs JavaScript.</p>
      </noscript>
      </div>
      <dl class="govuk-summary-list">
      <div class="govuk-summary-list__row">
      <dt class="govuk-summary-list__key">Scope</dt>
      <dd class="govuk-summary-list__value">Synthetic documentation specimen</dd>
      </div>
      <div class="govuk-summary-list__row">
      <dt class="govuk-summary-list__key">Live changes</dt>
      <dd class="govuk-summary-list__value">None</dd>
      </div>
      </dl>
  pub-components-related-navigation-1:
    title: "Related theme guidance"
    description: "Two real in-page destinations illustrate a small curated set."
    html: |
      <nav aria-label="More about themes">
      <ul class="govuk-list">
      <li>
      <a class="govuk-link" href="#colour">Colour settings</a>
      </li>
      <li>
      <a class="govuk-link" href="#compatibility">Compatibility</a>
      </li>
      </ul>
      </nav>
      <section id="colour" tabindex="-1">
      <h2 class="govuk-heading-m">Colour settings</h2>
      <p class="govuk-body">Palette and tone are separate from the native light or dark mode.</p>
      </section>
      <section id="compatibility" tabindex="-1">
      <h2 class="govuk-heading-m">Compatibility</h2>
      <p class="govuk-body">Check the supported frontend version before upgrading.</p>
      </section>
  pub-components-related-navigation-2:
    title: "Device documentation"
    description: "A narrow related group complements a sample record."
    html: |
      <h2 class="govuk-heading-m">Sample heating timer</h2>
      <nav aria-label="Heating timer documents">
      <ul class="govuk-list">
      <li>
      <a class="govuk-link" href="#manual">Operating instructions</a>
      </li>
      <li>
      <a class="govuk-link" href="#record">Maintenance record</a>
      </li>
      </ul>
      </nav>
      <section id="manual" tabindex="-1">
      <h2 class="govuk-heading-m">Operating instructions</h2>
      <p class="govuk-body">Use the instructions for the installed model.</p>
      </section>
      <section id="record" tabindex="-1">
      <h2 class="govuk-heading-m">Maintenance record</h2>
      <p class="govuk-body">A real record belongs to the household’s chosen maintenance system.</p>
      </section>
  pub-components-search-autocomplete-1:
    title: "Autocomplete known documentation titles"
    description: "Native browser suggestions use three actual local example titles. Submit a title or your own query to filter the records."
    html: |
      <form data-publishing-filter data-publishing-target="sample-results">
      <div class="govuk-form-group">
      <label class="govuk-label govuk-label--s" for="sample-query">Find example documentation</label>
      <div class="govuk-hint" id="sample-hint">Suggestions come from the fixed example list. Choose one or type your own query.</div>
      <input class="govuk-input" id="sample-query" name="query" type="search" aria-describedby="sample-hint" list="sample-suggestions" autocomplete="off">
      <datalist id="sample-suggestions">
      <option value="Colour settings">
      </option>
      <option value="Charts and tables">
      </option>
      <option value="Install the theme">
      </option>
      </datalist>
      </div>
      <div class="govuk-button-group govuk-!-display-none-print">
      <button type="submit" class="govuk-button" data-publishing-enable disabled>Find example records</button>
      <button type="button" class="govuk-button govuk-button--secondary" data-publishing-enable data-publishing-reset disabled>Clear filters</button>
      </div>
      <p class="govuk-body" data-publishing-status role="status">3 example records. No live data is connected.</p>
      <noscript>
      <p class="govuk-body">Filtering needs JavaScript. Read every example record below; this form cannot submit your query.</p>
      </noscript>
      </form>
      <section id="sample-results" aria-labelledby="sample-results-title">
      <h2 class="govuk-heading-m" id="sample-results-title">Example documentation</h2>
      <p class="govuk-body" data-publishing-empty hidden>No example records match. Clear filters or try a different query.</p>
      <ul class="govuk-list">
      <li data-publishing-record>
      <details class="govuk-details">
      <summary class="govuk-details__summary">
      <span class="govuk-details__summary-text">Colour settings</span>
      </summary>
      <div class="govuk-details__text">Vivid and Muted are separate from the native Light and Dark display mode.</div>
      </details>
      <p class="govuk-body">Guidance</p>
      </li>
      <li data-publishing-record>
      <details class="govuk-details">
      <summary class="govuk-details__summary">
      <span class="govuk-details__summary-text">Charts and tables</span>
      </summary>
      <div class="govuk-details__text">Energy charts use a shared visual contract and provide an accessible data table.</div>
      </details>
      <p class="govuk-body">Component reference</p>
      </li>
      <li data-publishing-record>
      <details class="govuk-details">
      <summary class="govuk-details__summary">
      <span class="govuk-details__summary-text">Install the theme</span>
      </summary>
      <div class="govuk-details__text">Choose the verified installation method matching ownership of your theme files.</div>
      </details>
      <p class="govuk-body">Installation guide</p>
      </li>
      </ul>
      </section>
  pub-components-search-autocomplete-2:
    title: "Autocomplete example equipment"
    description: "Suggestions and matching results use the same fixed, invented equipment records; nothing is queried from Home Assistant."
    html: |
      <form data-publishing-filter data-publishing-target="sample-results">
      <div class="govuk-form-group">
      <label class="govuk-label govuk-label--s" for="sample-query">Find example equipment</label>
      <div class="govuk-hint" id="sample-hint">Suggestions come from the fixed example list. Choose one or type your own query.</div>
      <input class="govuk-input" id="sample-query" name="query" type="search" aria-describedby="sample-hint" list="sample-suggestions" autocomplete="off">
      <datalist id="sample-suggestions">
      <option value="Example hall lamp">
      </option>
      <option value="Example kitchen lamp">
      </option>
      <option value="Example kitchen thermometer">
      </option>
      </datalist>
      </div>
      <div class="govuk-button-group govuk-!-display-none-print">
      <button type="submit" class="govuk-button" data-publishing-enable disabled>Find example records</button>
      <button type="button" class="govuk-button govuk-button--secondary" data-publishing-enable data-publishing-reset disabled>Clear filters</button>
      </div>
      <p class="govuk-body" data-publishing-status role="status">3 example records. No live data is connected.</p>
      <noscript>
      <p class="govuk-body">Filtering needs JavaScript. Read every example record below; this form cannot submit your query.</p>
      </noscript>
      </form>
      <section id="sample-results" aria-labelledby="sample-results-title">
      <h2 class="govuk-heading-m" id="sample-results-title">Example equipment</h2>
      <p class="govuk-body" data-publishing-empty hidden>No example records match. Clear filters or try a different query.</p>
      <ul class="govuk-list">
      <li data-publishing-record data-publishing-area="Hall">
      <details class="govuk-details">
      <summary class="govuk-details__summary">
      <span class="govuk-details__summary-text">Example hall lamp</span>
      </summary>
      <div class="govuk-details__text">A fictional light record for demonstrating name lookup.</div>
      </details>
      <p class="govuk-body">Light · Hall</p>
      </li>
      <li data-publishing-record data-publishing-area="Kitchen">
      <details class="govuk-details">
      <summary class="govuk-details__summary">
      <span class="govuk-details__summary-text">Example kitchen lamp</span>
      </summary>
      <div class="govuk-details__text">A second fictional light record; no device control is connected.</div>
      </details>
      <p class="govuk-body">Light · Kitchen</p>
      </li>
      <li data-publishing-record data-publishing-area="Kitchen">
      <details class="govuk-details">
      <summary class="govuk-details__summary">
      <span class="govuk-details__summary-text">Example kitchen thermometer</span>
      </summary>
      <div class="govuk-details__text">A fictional temperature-sensor record.</div>
      </details>
      <p class="govuk-body">Sensor · Kitchen</p>
      </li>
      </ul>
      </section>
  pub-components-single-page-notification-button-1:
    title: "Opt-in wording"
    description: "Local demonstration; no notification is enabled."
    html: |
      <h2 class="govuk-heading-m">Example reminder preference</h2>
      <p class="govuk-body">A real preference would name the event and destination before enabling it.</p>
      <button type="button" class="govuk-button govuk-button--secondary" data-demo-message="Example only. No reminder or notification channel was changed.">Review reminder options</button>
      <p class="govuk-body" data-demo-status role="status">
      </p>
  pub-components-single-page-notification-button-2:
    title: "Subscribed state specimen"
    description: "Static confirmed-state wording is labelled as an example."
    html: |
      <h2 class="govuk-heading-m">Example subscription state</h2>
      <dl class="govuk-summary-list">
      <div class="govuk-summary-list__row">
      <dt class="govuk-summary-list__key">Status</dt>
      <dd class="govuk-summary-list__value">Example: subscribed</dd>
      </div>
      <div class="govuk-summary-list__row">
      <dt class="govuk-summary-list__key">Event</dt>
      <dd class="govuk-summary-list__value">Documentation updates</dd>
      </div>
      <div class="govuk-summary-list__row">
      <dt class="govuk-summary-list__key">Destination</dt>
      <dd class="govuk-summary-list__value">Not connected in this demonstration</dd>
      </div>
      </dl>
      <button type="button" class="govuk-button govuk-button--secondary" data-demo-message="Example only. No subscription was stopped.">Review stopping updates</button>
      <p class="govuk-body" data-demo-status role="status">
      </p>
  pub-patterns-search-filter-1:
    title: "Search and area filters"
    description: "Try a name, select Kitchen or Hall, and apply the filters. Choices within Area are alternatives; the query and area criteria combine."
    html: |
      <form data-publishing-filter data-publishing-target="sample-results">
      <div class="govuk-form-group">
      <label class="govuk-label govuk-label--s" for="sample-query">Equipment name or type</label>
      <div class="govuk-hint" id="sample-hint">Search this fixed example list. No household data is connected.</div>
      <input class="govuk-input" id="sample-query" name="query" type="search" aria-describedby="sample-hint">
      </div>
      <fieldset class="govuk-fieldset">
      <legend class="govuk-fieldset__legend govuk-fieldset__legend--s">Area</legend>
      <div class="govuk-checkboxes">
      <div class="govuk-checkboxes__item">
      <input class="govuk-checkboxes__input" id="area-kitchen" name="area" type="checkbox" value="Kitchen" data-publishing-facet="area">
      <label class="govuk-label govuk-checkboxes__label" for="area-kitchen">Kitchen</label>
      </div>
      <div class="govuk-checkboxes__item">
      <input class="govuk-checkboxes__input" id="area-hall" name="area" type="checkbox" value="Hall" data-publishing-facet="area">
      <label class="govuk-label govuk-checkboxes__label" for="area-hall">Hall</label>
      </div>
      </div>
      </fieldset>
      <div class="govuk-button-group govuk-!-display-none-print">
      <button type="submit" class="govuk-button" data-publishing-enable disabled>Find example records</button>
      <button type="button" class="govuk-button govuk-button--secondary" data-publishing-enable data-publishing-reset disabled>Clear filters</button>
      </div>
      <p class="govuk-body" data-publishing-status role="status">3 example records. No live data is connected.</p>
      <noscript>
      <p class="govuk-body">Filtering needs JavaScript. Read every example record below; this form cannot submit your query.</p>
      </noscript>
      </form>
      <section id="sample-results" aria-labelledby="sample-results-title">
      <h2 class="govuk-heading-m" id="sample-results-title">Example equipment records</h2>
      <p class="govuk-body" data-publishing-empty hidden>No example records match. Clear filters or try a different query.</p>
      <ul class="govuk-list">
      <li data-publishing-record data-publishing-area="Hall">
      <details class="govuk-details">
      <summary class="govuk-details__summary">
      <span class="govuk-details__summary-text">Example hall lamp</span>
      </summary>
      <div class="govuk-details__text">A fictional light record for demonstrating name lookup.</div>
      </details>
      <p class="govuk-body">Light · Hall</p>
      </li>
      <li data-publishing-record data-publishing-area="Kitchen">
      <details class="govuk-details">
      <summary class="govuk-details__summary">
      <span class="govuk-details__summary-text">Example kitchen lamp</span>
      </summary>
      <div class="govuk-details__text">A second fictional light record; no device control is connected.</div>
      </details>

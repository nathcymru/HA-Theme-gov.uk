      <dl class="govuk-summary-list">
      <div class="govuk-summary-list__row">
      <dt class="govuk-summary-list__key">Input</dt>
      <dd class="govuk-summary-list__value">Whether the companion resource is confirmed loaded</dd>
      </div>
      <div class="govuk-summary-list__row">
      <dt class="govuk-summary-list__key">If confirmed</dt>
      <dd class="govuk-summary-list__value">Continue with compatibility checks</dd>
      </div>
      <div class="govuk-summary-list__row">
      <dt class="govuk-summary-list__key">If unknown</dt>
      <dd class="govuk-summary-list__value">Follow the resource verification guide</dd>
      </div>
      <div class="govuk-summary-list__row">
      <dt class="govuk-summary-list__key">Device action</dt>
      <dd class="govuk-summary-list__value">None</dd>
      </div>
      </dl>
  pub-frontend-templates-smart-answer-github-smart-answer-2:
    title: "Bounded branch navigation"
    description: "Both example outcomes exist as local sections."
    html: |
      <h2 class="govuk-heading-m">What has been verified?</h2>
      <nav aria-label="Verification result">
      <ul class="govuk-list">
      <li>
      <a class="govuk-link" href="#known">The resource was found</a>
      </li>
      <li>
      <a class="govuk-link" href="#unknown">The resource was not checked</a>
      </li>
      </ul>
      </nav>
      <section id="known" tabindex="-1">
      <h2 class="govuk-heading-m">Review compatibility</h2>
      <p class="govuk-body">Check the installed version against the documented baseline.</p>
      </section>
      <section id="unknown" tabindex="-1">
      <h2 class="govuk-heading-m">Verify the resource first</h2>
      <p class="govuk-body">Do not infer a device or theme fault from an unverified installation.</p>
      </section>
  pub-frontend-templates-smart-answer-simple-smart-answer-1:
    title: "Choose a guidance route"
    description: "Simple choices navigate to actual local explanations."
    html: |
      <h2 class="govuk-heading-m">What do you want to do?</h2>
      <nav aria-label="Choose a task">
      <ul class="govuk-list">
      <li>
      <a class="govuk-link" href="#install">Install the theme</a>
      </li>
      <li>
      <a class="govuk-link" href="#change">Change the colours</a>
      </li>
      </ul>
      </nav>
      <section id="install" tabindex="-1">
      <h2 class="govuk-heading-m">Installation guidance</h2>
      <p class="govuk-body">Choose the documented method for your setup.</p>
      </section>
      <section id="change" tabindex="-1">
      <h2 class="govuk-heading-m">Colour guidance</h2>
      <p class="govuk-body">Review palette, tone and native display mode.</p>
      </section>
  pub-frontend-templates-smart-answer-simple-smart-answer-2:
    title: "Known or unknown setup"
    description: "An uncertainty branch remains useful."
    html: |
      <h2 class="govuk-heading-m">Do you know how the theme was installed?</h2>
      <nav aria-label="Installation knowledge">
      <ul class="govuk-list">
      <li>
      <a class="govuk-link" href="#yes">Yes</a>
      </li>
      <li>
      <a class="govuk-link" href="#unsure">I am not sure</a>
      </li>
      </ul>
      </nav>
      <section id="yes" tabindex="-1">
      <h2 class="govuk-heading-m">Use the matching guide</h2>
      <p class="govuk-body">Follow the method that owns the installed theme files.</p>
      </section>
      <section id="unsure" tabindex="-1">
      <h2 class="govuk-heading-m">Check ownership first</h2>
      <p class="govuk-body">Review the installation record before replacing any files.</p>
      </section>

    description: A single heading link opens a useful local room overview. The card is navigation; it contains no nested device buttons.
    height: 680
    html: <article class="civica-card-demo" aria-labelledby="legacy-kitchen-title"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="legacy-kitchen-title"><a class="govuk-link" href="#card-kitchen">Kitchen overview</a></h2><p class="govuk-body">Find the example ceiling light, temperature reading and room notes.</p><p class="govuk-body">The heading link opens the information below. It does not operate a device.</p></div></article><section id="card-kitchen" tabindex="-1"><h2 class="govuk-heading-m">Kitchen overview</h2><p class="govuk-body">Synthetic observations reported on <time datetime="2026-11-11T18:42:00+00:00">11 November 2026 at 18:42 GMT</time> (Europe/London).</p><dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Ceiling light</dt><dd class="govuk-summary-list__value">Off</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Room temperature</dt><dd class="govuk-summary-list__value">19.8 °C</dd></div></dl><p class="govuk-body">These are independent example entities. No appliance capability or remote action is inferred from the room name.</p></section>
  nhs-card-information:
    title: An information card with a complete reading
    description: A non-clickable card shows the measured quantity, unit, source and observation time. It has no pretend preview or reset actions.
    height: 500
    html: <article class="civica-card-demo" aria-labelledby="information-temperature-title"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="information-temperature-title">Living room temperature</h2><p class="govuk-body"><strong>20.5 °C</strong></p><p class="govuk-body">Reported by the example room sensor on <time datetime="2026-11-11T18:42:00+00:00">11 November 2026 at 18:42 GMT</time> (Europe/London).</p><p class="govuk-body">This is a synthetic measured air temperature, not a heating target. The card displays information and has no interactive controls.</p></div></article>
  nhs-action-link-journey:
    title: Start a dashboard setup journey
    description: The NHS action-link pattern signals the start of a service or task.
    height: 340
    html: |
      <div class="civica-action-link">
      <a class="govuk-link" href="#start-view">
      <svg aria-hidden="true" focusable="false" width="40" height="40" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="20" fill="#d2e2f1">
      </circle>
      <path d="M12 20H28M22 14L28 20L22 26" fill="none" stroke="#0b0c0c" stroke-width="2">
      </path>
      </svg>
      <span>Set up a shared view</span>
      </a>
      </div>
      <section id="start-view" tabindex="-1">
      <h2 class="govuk-heading-m">Set up a shared view</h2>
      <p class="govuk-body">Choose rooms and review their labels.</p>
      </section>
    artwork:
      creator: civica.uk project; Codex-assisted original SVG markup
      licence: MIT, original project documentation code under LICENSE

      <td class="govuk-table__cell govuk-table__cell--numeric">20.1</td>
      <td class="govuk-table__cell govuk-table__cell--numeric">20.3</td>
      <td class="govuk-table__cell govuk-table__cell--numeric">20.0</td>
      <td class="govuk-table__cell govuk-table__cell--numeric">20.2</td>
      </tr>
      </tbody>
      </table>
      </div>

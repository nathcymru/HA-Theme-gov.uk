      purpose: Supplement a named navigation link with a recognisable directional cue.
      intended_background: Light documentation surface; functional strokes use the component semantic text/state role.
      alternative_text_decision: Decorative SVG hidden from assistive technology; the complete visible link text supplies its accessible name.
      review_status: Static source/provenance recorded; rendered verification is tracked separately in the change acceptance.
  nhs-action-link-help:
    title: Open display-colour help
    description: A real local help destination explains palette, tone and mode without changing a preference.
    height: 340
    html: |
      <div class="civica-action-link">
      <a class="govuk-link" href="#review-preferences">
      <svg aria-hidden="true" focusable="false" width="40" height="40" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="20" fill="#d2e2f1">
      </circle>
      <path d="M12 20H28M22 14L28 20L22 26" fill="none" stroke="#0b0c0c" stroke-width="2">
      </path>
      </svg>
      <span>Understand display colours</span>
      </a>
      </div>
      <section id="review-preferences" tabindex="-1">
      <h2 class="govuk-heading-m">Understand display colours</h2>
      <p class="govuk-body">Choose a Colour palette for the interface’s brand colours. Use muted colours changes the tone; Home Assistant’s Light, Dark or Auto display mode stays separate. Selecting a palette applies through the native theme flow. Reading this help changes no preference.</p>
      </section>

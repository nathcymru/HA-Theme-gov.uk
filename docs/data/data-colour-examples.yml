examples:
  data-colour-categorical:
    title: Stable device identities in four display settings
    description: The existing identity generator supplies each colour and line/marker choice; a common table distinguishes a missing reading from zero.
    height: 1600
    html: |-
      <section aria-labelledby="categorical-heading">
      <h2 class="govuk-heading-m" id="categorical-heading">The same devices keep their identity</h2>
      <p class="govuk-body">Synthetic data: energy used from 09:00 to 10:00 on 12 November 2026, Europe/London. Each panel uses the same three fixed entity IDs and the existing chart-colour generator. The device names and line/marker choices remain the same across all four settings.</p>
      <p class="govuk-body">These are labelled reference views, not theme controls. In the maintained charts, Vivid or Muted follows the colour toggle and Light or Dark follows the display mode. Choosing another identity palette does not change a device’s chart colour.</p>
      <div class="c-data-colour-contexts"><section class="c-data-colour-context" aria-labelledby="categorical-vivid-light" style="--example-chart-surface:#FFFFFF;--example-chart-text:#0B0C0C">
      <h3 class="govuk-heading-s" id="categorical-vivid-light">Vivid / Light</h3>
      <ul class="c-data-colour-keys"><li data-chart-key="sensor.washing_machine_energy" data-chart-tone="vivid" data-chart-mode="light" data-chart-colour="#007684" data-chart-pattern="diagonal" data-chart-symbol="circle" data-chart-line-dash="8,3,2,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#007684" stroke-width="1.5" stroke-dasharray="8 3 2 3"/><circle cx="42" cy="12" r="6" fill="#007684" stroke="#007684" stroke-width="1.5"/></svg><span><strong>Washing machine</strong><br><span class="c-data-colour-code">#007684</span></span></li>
      <li data-chart-key="sensor.tumble_dryer_energy" data-chart-tone="vivid" data-chart-mode="light" data-chart-colour="#007B8C" data-chart-pattern="dots" data-chart-symbol="diamond" data-chart-line-dash="8,3,2,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#007B8C" stroke-width="1.5" stroke-dasharray="8 3 2 3"/><path d="m42 4 7 8-7 8-7-8Z" fill="#007B8C" stroke="#007B8C" stroke-width="1.5"/></svg><span><strong>Tumble dryer</strong><br><span class="c-data-colour-code">#007B8C</span></span></li>
      <li data-chart-key="sensor.dishwasher_energy" data-chart-tone="vivid" data-chart-mode="light" data-chart-colour="#9F3A03" data-chart-pattern="cross" data-chart-symbol="emptyCircle" data-chart-line-dash="6,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#9F3A03" stroke-width="1.5" stroke-dasharray="6 3"/><circle cx="42" cy="12" r="6" fill="none" stroke="#9F3A03" stroke-width="1.5"/></svg><span><strong>Dishwasher</strong><br><span class="c-data-colour-code">#9F3A03</span></span></li></ul>
      </section>
      <section class="c-data-colour-context" aria-labelledby="categorical-muted-light" style="--example-chart-surface:#FFFFFF;--example-chart-text:#0B0C0C">
      <h3 class="govuk-heading-s" id="categorical-muted-light">Muted / Light</h3>
      <ul class="c-data-colour-keys"><li data-chart-key="sensor.washing_machine_energy" data-chart-tone="muted" data-chart-mode="light" data-chart-colour="#228593" data-chart-pattern="diagonal" data-chart-symbol="circle" data-chart-line-dash="8,3,2,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#228593" stroke-width="1.5" stroke-dasharray="8 3 2 3"/><circle cx="42" cy="12" r="6" fill="#228593" stroke="#228593" stroke-width="1.5"/></svg><span><strong>Washing machine</strong><br><span class="c-data-colour-code">#228593</span></span></li>
      <li data-chart-key="sensor.tumble_dryer_energy" data-chart-tone="muted" data-chart-mode="light" data-chart-colour="#0A8A9C" data-chart-pattern="dots" data-chart-symbol="diamond" data-chart-line-dash="8,3,2,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#0A8A9C" stroke-width="1.5" stroke-dasharray="8 3 2 3"/><path d="m42 4 7 8-7 8-7-8Z" fill="#0A8A9C" stroke="#0A8A9C" stroke-width="1.5"/></svg><span><strong>Tumble dryer</strong><br><span class="c-data-colour-code">#0A8A9C</span></span></li>
      <li data-chart-key="sensor.dishwasher_energy" data-chart-tone="muted" data-chart-mode="light" data-chart-colour="#91614F" data-chart-pattern="cross" data-chart-symbol="emptyCircle" data-chart-line-dash="6,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#91614F" stroke-width="1.5" stroke-dasharray="6 3"/><circle cx="42" cy="12" r="6" fill="none" stroke="#91614F" stroke-width="1.5"/></svg><span><strong>Dishwasher</strong><br><span class="c-data-colour-code">#91614F</span></span></li></ul>
      </section>
      <section class="c-data-colour-context" aria-labelledby="categorical-vivid-dark" style="--example-chart-surface:#24282B;--example-chart-text:#FFFFFF">
      <h3 class="govuk-heading-s" id="categorical-vivid-dark">Vivid / Dark</h3>
      <ul class="c-data-colour-keys"><li data-chart-key="sensor.washing_machine_energy" data-chart-tone="vivid" data-chart-mode="dark" data-chart-colour="#00C4DB" data-chart-pattern="diagonal" data-chart-symbol="circle" data-chart-line-dash="8,3,2,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#00C4DB" stroke-width="1.5" stroke-dasharray="8 3 2 3"/><circle cx="42" cy="12" r="6" fill="#00C4DB" stroke="#00C4DB" stroke-width="1.5"/></svg><span><strong>Washing machine</strong><br><span class="c-data-colour-code">#00C4DB</span></span></li>
      <li data-chart-key="sensor.tumble_dryer_energy" data-chart-tone="vivid" data-chart-mode="dark" data-chart-colour="#00C9E3" data-chart-pattern="dots" data-chart-symbol="diamond" data-chart-line-dash="8,3,2,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#00C9E3" stroke-width="1.5" stroke-dasharray="8 3 2 3"/><path d="m42 4 7 8-7 8-7-8Z" fill="#00C9E3" stroke="#00C9E3" stroke-width="1.5"/></svg><span><strong>Tumble dryer</strong><br><span class="c-data-colour-code">#00C9E3</span></span></li>
      <li data-chart-key="sensor.dishwasher_energy" data-chart-tone="vivid" data-chart-mode="dark" data-chart-colour="#ED8860" data-chart-pattern="cross" data-chart-symbol="emptyCircle" data-chart-line-dash="6,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#ED8860" stroke-width="1.5" stroke-dasharray="6 3"/><circle cx="42" cy="12" r="6" fill="none" stroke="#ED8860" stroke-width="1.5"/></svg><span><strong>Dishwasher</strong><br><span class="c-data-colour-code">#ED8860</span></span></li></ul>
      </section>
      <section class="c-data-colour-context" aria-labelledby="categorical-muted-dark" style="--example-chart-surface:#24282B;--example-chart-text:#FFFFFF">
      <h3 class="govuk-heading-s" id="categorical-muted-dark">Muted / Dark</h3>
      <ul class="c-data-colour-keys"><li data-chart-key="sensor.washing_machine_energy" data-chart-tone="muted" data-chart-mode="dark" data-chart-colour="#62B6C4" data-chart-pattern="diagonal" data-chart-symbol="circle" data-chart-line-dash="8,3,2,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#62B6C4" stroke-width="1.5" stroke-dasharray="8 3 2 3"/><circle cx="42" cy="12" r="6" fill="#62B6C4" stroke="#62B6C4" stroke-width="1.5"/></svg><span><strong>Washing machine</strong><br><span class="c-data-colour-code">#62B6C4</span></span></li>
      <li data-chart-key="sensor.tumble_dryer_energy" data-chart-tone="muted" data-chart-mode="dark" data-chart-colour="#59BBCC" data-chart-pattern="dots" data-chart-symbol="diamond" data-chart-line-dash="8,3,2,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#59BBCC" stroke-width="1.5" stroke-dasharray="8 3 2 3"/><path d="m42 4 7 8-7 8-7-8Z" fill="#59BBCC" stroke="#59BBCC" stroke-width="1.5"/></svg><span><strong>Tumble dryer</strong><br><span class="c-data-colour-code">#59BBCC</span></span></li>
      <li data-chart-key="sensor.dishwasher_energy" data-chart-tone="muted" data-chart-mode="dark" data-chart-colour="#C49583" data-chart-pattern="cross" data-chart-symbol="emptyCircle" data-chart-line-dash="6,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#C49583" stroke-width="1.5" stroke-dasharray="6 3"/><circle cx="42" cy="12" r="6" fill="none" stroke="#C49583" stroke-width="1.5"/></svg><span><strong>Dishwasher</strong><br><span class="c-data-colour-code">#C49583</span></span></li></ul>
      </section></div>
      <div class="civica-table-scroll" role="region" tabindex="0" aria-label="Categorical example values and stable identities"><table class="govuk-table"><caption class="govuk-table__caption govuk-table__caption--m">The values are the same in every colour setting</caption><thead class="govuk-table__head"><tr class="govuk-table__row"><th scope="col" class="govuk-table__header">Device and stable identity</th><th scope="col" class="govuk-table__header">Energy (kWh)</th><th scope="col" class="govuk-table__header">Data status</th></tr></thead><tbody class="govuk-table__body"><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Washing machine<br><code class="c-data-colour-id">sensor.washing_machine_energy</code></th><td class="govuk-table__cell">0.8</td><td class="govuk-table__cell">Supplied in this invented example.</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Tumble dryer<br><code class="c-data-colour-id">sensor.tumble_dryer_energy</code></th><td class="govuk-table__cell">1.2</td><td class="govuk-table__cell">Supplied in this invented example.</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Dishwasher<br><code class="c-data-colour-id">sensor.dishwasher_energy</code></th><td class="govuk-table__cell">Not supplied</td><td class="govuk-table__cell">No reading for this period. It is not zero.</td></tr></tbody></table></div>
      <p class="govuk-body">The dishwasher keeps its identity colour even though its reading is missing. A colour key identifies the source; it does not say that a value was received. Labels and the table remain essential because neither different hex values nor a contrast check proves that every colour pair or marker is easy to distinguish.</p>
      <details class="govuk-details"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">How these swatches were produced</span></summary><div class="govuk-details__text"><p>Each row was calculated with <code>chartSeriesStyle(entityId, { tone, mode })</code> from <code>design-system/chart-colours.mjs</code>, algorithm <code>oklch-identity-v1</code>. The line specimens use the existing 1.5px width. The values above do not affect the colour.</p><p>There is no new categorical palette in this example. If the generator changes, regenerate these references and review the result. The quantitative examples below use a different mapping because colour represents a measured value rather than an identity.</p></div></details>
      </section>

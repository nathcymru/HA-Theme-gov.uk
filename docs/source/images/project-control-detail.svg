<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">A reported lamp value and a separate editable draft</title>
  <desc id="description">The left panel shows an illustrative reported lamp value of 25 percent. The right panel shows a 40 percent draft, a range control, precise entry, decrease and increase buttons, and a separate action. Changing a draft does not confirm that a device changed. All values are invented and every drawn control is non-interactive.</desc>
  <!-- Original civica.uk explanatory artwork. MIT. Schematic only: not a screenshot or device-state evidence. -->
  <rect width="960" height="560" fill="#F3F6F9"/>
  <g fill="#FFFFFF">
    <rect x="40" y="48" width="328" height="464"/>
    <rect x="408" y="48" width="512" height="464"/>
  </g>
  <!-- The left reading is separate from the right draft. Values are also supplied in the HTML caption. -->
  <path d="M174 100h60l32 80H142Z" fill="#1D70B8"/>
  <rect x="198" y="180" width="12" height="58" fill="#103E65"/>
  <rect x="166" y="238" width="76" height="16" fill="#103E65"/>
  <text x="204" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="700" fill="#0B0C0C">25%</text>
  <rect x="88" y="412" width="232" height="16" fill="#BFD9ED"/>
  <rect x="88" y="412" width="58" height="16" fill="#103E65"/>
  <text x="664" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="700" fill="#0B0C0C">40%</text>
  <!-- Range anatomy: bounded rail and a round handle at the draft position. -->
  <rect x="464" y="216" width="400" height="12" fill="#BFD9ED"/>
  <rect x="464" y="216" width="160" height="12" fill="#1D70B8"/>
  <circle cx="624" cy="222" r="24" fill="#1D70B8"/>
  <!-- Precise entry and step alternatives: schematic controls, not live elements. -->
  <rect x="468" y="284" width="80" height="72" fill="#F3F6F9" stroke="#0B0C0C" stroke-width="4"/>
  <path d="M492 320h32" fill="none" stroke="#0B0C0C" stroke-width="6"/>
  <rect x="572" y="284" width="184" height="72" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="4"/>
  <text x="664" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" fill="#0B0C0C">40</text>
  <rect x="780" y="284" width="80" height="72" fill="#F3F6F9" stroke="#0B0C0C" stroke-width="4"/>
  <path d="M804 320h32m-16-16v32" fill="none" stroke="#0B0C0C" stroke-width="6"/>
  <rect x="468" y="408" width="392" height="64" fill="#1D70B8"/>
  <path d="M648 440h32m-12-12 12 12-12 12" fill="none" stroke="#FFFFFF" stroke-width="5"/>

</svg>

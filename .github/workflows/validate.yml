name: Validate civica.uk
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: python3 docs/scripts/sync-palettes.py --check
      - run: python3 -m venv .venv && .venv/bin/pip install PyYAML Jinja2
      - run: .venv/bin/python lighting/scripts/check-ha.py
      - run: bundle exec middleman build
        working-directory: docs
      - run: python3 scripts/check-docs.py
      - run: npm run check:brand
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: civica-home-assistant
          path: dist/civica-home-assistant.zip
      - uses: actions/upload-artifact@v4
        with:
          name: civica-design-system
          path: docs/build/

name: Validate civica
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted, transferred]
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
  issues: read
# Serialise the complete build and publication, including issue-triggered runs.
# Pending refreshes may be coalesced; each trusted run reads the latest main and
# the complete current issue set, so an older event cannot restore old content.
concurrency:
  # Irrelevant issue events must not evict a pending publication before their
  # job condition skips them. They get their own group instead.
  group: >-
    civica-validate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
    (github.event_name == 'issues' &&
    !contains(github.event.issue.labels.*.name, 'roadmap: accepted') &&
    !contains(github.event.issue.labels.*.name, 'roadmap: in-works') &&
    !contains(github.event.issue.labels.*.name, 'roadmap: completed') &&
    github.event.label.name != 'roadmap: accepted' &&
    github.event.label.name != 'roadmap: in-works' &&
    github.event.label.name != 'roadmap: completed') && format('ignored-{0}', github.run_id) || 'publish' }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'roadmap: accepted') ||
      contains(github.event.issue.labels.*.name, 'roadmap: in-works') ||
      contains(github.event.issue.labels.*.name, 'roadmap: completed') ||
      github.event.label.name == 'roadmap: accepted' ||
      github.event.label.name == 'roadmap: in-works' ||
      github.event.label.name == 'roadmap: completed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs
      - run: npm ci
      - name: Refresh reviewed theme roadmap
        if: github.event_name != 'pull_request'
        run: npm run roadmap:fetch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: python3 docs/scripts/sync-palettes.py --check
      - run: python3 docs/scripts/sync-brand.py --check
      - run: python3 -m venv .venv && .venv/bin/pip install PyYAML Jinja2
      - run: .venv/bin/python lighting/scripts/check-ha.py
      - run: bundle exec middleman build
        working-directory: docs
      - run: python3 scripts/check-docs.py
      - run: npm run check:guidance
      - run: npm run check:coverage
      - run: npm run check:brand -- --check-built
      - run: npm run check:naming
      # The hosted runner supplies Chromium's shared libraries. Install the
      # pinned browser without a redundant, network-dependent apt refresh.
      # Browser launch and the full suite below remain mandatory.
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: civica
          path: |
            dist/civica.zip
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: civica-design-system
          path: docs/build/
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: docs/build/
  deploy-docs:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish design documentation
        id: deployment
        uses: actions/deploy-pages@v4

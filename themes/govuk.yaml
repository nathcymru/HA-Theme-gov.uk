      input-disabled-fill-color: "#2a2e30"
      input-disabled-ink-color: "#b1b4b6"
      input-outlined-idle-border-color: "#b1b4b6"
      input-outlined-hover-border-color: "#ffffff"
      input-outlined-disabled-border-color: "#6f777b"
      input-dropdown-icon-color: "#ffffff"
      mdc-text-field-fill-color: "#1d2021"
      mdc-text-field-ink-color: "#ffffff"
      mdc-text-field-label-ink-color: "#ffffff"
      mdc-text-field-idle-line-color: "#b1b4b6"
      mdc-text-field-hover-line-color: "#ffffff"

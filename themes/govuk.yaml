      mdc-select-hover-line-color: "#ffffff"
      mdc-select-outlined-idle-border-color: "#b1b4b6"
      mdc-select-outlined-hover-border-color: "#ffffff"
      mdc-select-dropdown-icon-color: "#ffffff"

      mdc-checkbox-unchecked-color: "#ffffff"

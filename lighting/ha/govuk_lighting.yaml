script:
  govuk_lights_engine:
    alias: "GOV.UK lights: engine (internal, called by room wrappers)"
    mode: parallel
    max: 20
    fields:
      room: {description: "Room id"}
      area: {description: "Home Assistant area id"}
      recipe: {description: "Recipe id"}
      brightness: {description: "Optional brightness percent override"}
      include: {description: "Extra light entity ids"}
      exclude: {description: "Light entity ids to ignore"}
    sequence:
      - variables:
          recipes: {"candlelight":{"cat":"white","t":1,"b":30,"k":{"hue":2000,"innr":1800}},"warm_white":{"cat":"white","t":1,"b":100,"k":{"hue":2700,"innr":2700}},"daylight":{"cat":"white","t":1,"b":100,"k":{"hue":4000,"innr":4000}},"cool_white":{"cat":"white","t":1,"b":100,"k":{"hue":6500,"innr":6500}},"red":{"cat":"color","t":1,"b":100,"colors":[{"hue":[255,0,0],"innr":[255,0,0]}]},"orange":{"cat":"color","t":1,"b":100,"colors":[{"hue":[255,94,0],"innr":[255,80,0]}]},"yellow":{"cat":"color","t":1,"b":100,"colors":[{"hue":[255,217,0],"innr":[255,200,0]}]},"green":{"cat":"color","t":1,"b":100,"colors":[{"hue":[0,255,0],"innr":[0,255,0]}]},"cyan":{"cat":"color","t":1,"b":100,"colors":[{"hue":[0,242,255],"innr":[0,230,255]}]},"blue":{"cat":"color","t":1,"b":100,"colors":[{"hue":[0,43,255],"innr":[0,20,255]}]},"purple":{"cat":"color","t":1,"b":100,"colors":[{"hue":[212,0,255],"innr":[212,0,255]}]},"rugby":{"cat":"scene","t":5,"b":100,"interval":null,"flashing":false,"max_s":0,"colors":[{"hue":[211,10,36],"innr":[255,0,0],"b":100},{"hue":[0,128,0],"innr":[0,255,0],"b":100}],"white_k":5000},"football":{"cat":"scene","t":15,"b":100,"interval":null,"flashing":false,"max_s":0,"colors":[{"hue":[0,77,152],"innr":[0,43,255],"b":100},{"hue":[0,255,0],"innr":[0,255,0],"b":100}],"white_k":4000},"halloween":{"cat":"scene","t":8,"b":100,"interval":null,"flashing":false,"max_s":0,"colors":[{"hue":[255,94,0],"innr":[255,94,0],"b":100},{"hue":[128,0,128],"innr":[128,0,128],"b":100},{"hue":[0,255,0],"innr":[0,255,0],"b":100}],"white_k":2700},"christmas":{"cat":"scene","t":20,"b":100,"interval":null,"flashing":false,"max_s":0,"colors":[{"hue":[255,0,0],"innr":[255,0,0],"b":100},{"hue":[0,128,0],"innr":[0,128,0],"b":100},{"hue":[255,215,0],"innr":[255,165,0],"b":100},{"hue":[224,224,224],"innr":[224,224,224],"b":60}],"white_k":2700},"emergency":{"cat":"scene","t":0,"b":100,"interval":0.5,"flashing":true,"max_s":60,"colors":[{"hue":[255,0,0],"innr":[255,0,0],"b":100},{"hue":[0,0,255],"innr":[0,0,255],"b":100}],"white_k":2700}}
          include: "{{ include | default([]) }}"
          exclude: "{{ exclude | default([]) }}"
          rec: "{{ recipes[recipe] }}"
          owner: "input_text.govuk_lights_{{ room }}"
      - condition: template
        value_template: "{{ rec is defined and rec is mapping }}"
      # Flashing scenes need an explicit opt-in helper; refuse otherwise.
      - condition: template
        value_template: "{{ not rec.flashing or is_state('input_boolean.govuk_lights_allow_flashing','on') }}"
      - action: input_text.set_value
        target: {entity_id: "{{ owner }}"}
        data: {value: "{{ recipe }}"}
      - variables: {started: "{{ now().timestamp() }}"}
      - repeat:
          sequence:
            - variables:
                lights: >-
                  {% set ns = namespace(l=[]) %}{% for e in area_entities(area) if e.startswith('light.') %}{% set m = state_attr(e,'entity_id') %}{% set ns.l = ns.l + (m if m else [e]) %}{% endfor %}{% for e in include %}{% set ns.l = ns.l + [e] %}{% endfor %}{{ ns.l | unique | reject('in', exclude) | sort | list }}
                step: "{{ repeat.index - 1 }}"
            - repeat:
                for_each: "{{ lights }}"
                sequence:
                  - variables:
                      e: "{{ repeat.item }}"
                      i: "{{ repeat.index - 1 }}"
                      modes: "{{ state_attr(e,'supported_color_modes') or [] }}"
                      brand: "{{ 'innr' if 'innr' in ((device_attr(e,'manufacturer') or '') | lower) else 'hue' }}"
                      can_color: "{{ modes | select('in', ['hs','xy','rgb','rgbw','rgbww']) | list | length > 0 }}"
                      can_ct: "{{ 'color_temp' in modes }}"
                      can_dim: "{{ can_color or can_ct or 'brightness' in modes or 'white' in modes }}"
                      pct: "{{ brightness | default(rec.b) | int }}"
                      tr: "{{ rec.t }}"
                  - condition: template
                    value_template: "{{ states(e) not in ['unavailable','unknown'] }}"
                  - choose:
                      - conditions: "{{ rec.cat == 'white' and (can_ct or can_color) }}"
                        sequence:
                          - action: light.turn_on
                            target: {entity_id: "{{ e }}"}
                            data:
                              color_temp_kelvin: >-
                                {% set k = rec.k[brand] %}{% set lo = state_attr(e,'min_color_temp_kelvin') %}{% set hi = state_attr(e,'max_color_temp_kelvin') %}{{ [[k, lo or k] | max, hi or k] | min }}
                              brightness_pct: "{{ pct }}"
                      - conditions: "{{ rec.cat == 'color' and can_color }}"
                        sequence:
                          - action: light.turn_on
                            target: {entity_id: "{{ e }}"}
                            data: {rgb_color: "{{ rec.colors[0][brand] }}", brightness_pct: "{{ pct }}"}
                      - conditions: "{{ rec.cat == 'scene' and can_color and rec.colors | length > 0 }}"
                        sequence:
                          - action: light.turn_on
                            target: {entity_id: "{{ e }}"}
                            data:
                              rgb_color: "{{ rec.colors[(i + step) % (rec.colors | length)][brand] }}"
                              brightness_pct: "{{ rec.colors[(i + step) % (rec.colors | length)].b }}"
                              transition: "{{ tr }}"
                      - conditions: "{{ rec.cat == 'scene' and can_ct }}"
                        sequence:
                          - action: light.turn_on
                            target: {entity_id: "{{ e }}"}
                            data: {color_temp_kelvin: "{{ rec.white_k }}", brightness_pct: 60, transition: "{{ tr }}"}
                    default:
                      - if: "{{ can_dim and rec.cat != 'color' }}"
                        then:
                          - action: light.turn_on
                            target: {entity_id: "{{ e }}"}
                            data: {brightness_pct: "{{ 60 if rec.cat == 'scene' else pct }}"}
            - delay: "{{ [ (rec.interval if rec.interval is not none else rec.t), 0.5 ] | max }}"
          while:
            # Static recipes run once. Scenes loop only while this room still owns the recipe,
            # so a newer apply or an external stop ends the old loop at its next check.
            - condition: template
              value_template: "{{ rec.cat == 'scene' or repeat.index == 1 }}"
            - condition: template
              value_template: "{{ states(owner) == recipe }}"
            - condition: template
              value_template: "{{ rec.max_s == 0 or (now().timestamp() - started) < rec.max_s }}"
      - action: input_text.set_value
        target: {entity_id: "{{ owner }}"}
        data: {value: "{{ recipe if rec.cat != 'scene' else 'stopped' }}"}

